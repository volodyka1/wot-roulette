<title>Отметки на стволе</title>

<!--
  «Отметки на стволе» в моде WotStat «Виджеты»: игрок и танк — из игры (только приём). Свёрстано в 380 px.
  ?demo=loop|hangar|queue|battle|edge|mark|ended|after|result|nodata|first|max|low|dead|offmode|replay|offline
  &tank=hacker|stk2|e100|is4|strv|ms1|<nation:Tag> &still=<мс> &speed=<x>; ?test=1 — без связи, window.mkMsg(obj).
  Мод шлёт игре каждый кадр: в покое — ни анимаций, ни записей в DOM; только конечные твины ≤ 1,1 с.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--text:#f3f3f8;--muted:#8d8da3;--dim:#5c5c70;
  --a1:#f5a524;--a2:#ffd66b;--grad:linear-gradient(100deg,#e8970f 0%,#ffd66b 100%);--on-gold:#1f1504;
  --grad-tab:linear-gradient(100deg,#d48a10 0%,#ffcf5c 100%);

  --dn:linear-gradient(100deg,#9b1230,#e0294a);
  --fd:Montserrat,Inter,system-ui,sans-serif;--fu:Inter,system-ui,sans-serif;
  --mk-w:380px;--mk-pl:20px;--mk-pr:18px;--mk-cut:14px;

  --mk-big:linear-gradient(100deg,#fff 0%,#fff1cc 38%,#ffc23d 100%);
  --mk-big-max:linear-gradient(100deg,#fff 0%,#c9ffe9 45%,#2ee59d 100%);

  --mk-assist:#bdf3ff;--mk-up:#2ee59d;--mk-down:#ff5c7a;
  --mk-fill:linear-gradient(90deg,#6e3f06,#e8970f 45%,#ffd66b);--mk-fill-ok:linear-gradient(90deg,#0f8a5b,#2ee59d);
  --mk-zone-plus:rgba(46,229,157,.10);--mk-zone-mark:rgba(255,236,180,.10);--ts:0 1px 3px rgba(0,0,0,.85)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent!important;overflow:hidden}
body{pointer-events:none;user-select:none;font:14px/1.45 var(--fu);color:var(--text);-webkit-font-smoothing:antialiased}
#mk{width:380px}
#mk,#mk *{animation:none!important;transition:none!important} /* движение — только твины на JS */
#mkHint{margin:4px 14px 2px 22px;padding:6px 10px;border-radius:3px;background:rgba(12,12,18,.92);box-shadow:inset 0 0 0 1px rgba(245,165,36,.45);font:700 12px/1.3 var(--fu);color:var(--mk-label)}

/* оболочка как «Эфир» */

.mk .sh{position:absolute;left:14px;right:14px;top:12px;bottom:-8px;z-index:-3;background:rgba(0,0,0,.55);filter:blur(14px)}

.mk::before{content:"";position:absolute;left:14px;right:0;top:0;height:3px;z-index:5;background:var(--grad);box-shadow:0 0 12px rgba(245,165,36,.6),0 0 3px rgba(255,214,107,.9)}
.mk::after{content:"";position:absolute;left:0;right:14px;bottom:0;height:3px;z-index:5;background:var(--edge);box-shadow:var(--eglow)}
.mk.s-ok{--edge:linear-gradient(90deg,var(--ok2),var(--ok));--eglow:0 0 12px rgba(46,229,157,.7)}
.mk.s-bt{--edge:linear-gradient(90deg,#a8650e,#f5a524)}
.mk .hl{position:absolute;inset:0;z-index:7;opacity:0;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);box-shadow:inset 0 0 0 2px var(--hlc,#ffd66b),inset 0 0 54px var(--hlg,rgba(245,165,36,.5))}
.mk.s-ok .hl{--hlc:var(--ok);--hlg:rgba(46,229,157,.45)}
.mk .hero{position:absolute;z-index:2}
.mk .hero canvas,.mk .hero svg{position:absolute;left:0;top:0;overflow:visible}

.mk .lbl{display:flex;align-items:center;gap:8px;height:14px;font:800 italic 11px/1 var(--fd);letter-spacing:.17em;color:var(--mk-label);text-shadow:var(--ts);text-transform:uppercase;white-space:nowrap}
.mk .lbl::before{content:"";flex:0 0 18px;height:3px;background:var(--grad);transform:skewX(-30deg)}
/* вкладка-статус */

.mk .chipst{display:inline-flex;align-items:center;height:21px;padding:0 10px;border-radius:3px;transform:skewX(-12deg);font:900 italic 11px/1 var(--fd);letter-spacing:.08em;white-space:nowrap}
.mk .chipst.brand{background:var(--grad-tab);color:var(--on-gold);box-shadow:0 3px 14px rgba(245,165,36,.35)}

.mk .name{min-width:0;padding-right:3px;margin-left:2px;font:900 italic 19px/1.08 var(--fd);letter-spacing:-.015em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 10px rgba(0,0,0,.75)}

.mk .big.none b{background:none;color:#4a4b5c;-webkit-text-fill-color:#4a4b5c;filter:none}.mk .big.none i{color:#4a4b5c}
.mk .sub,.mk .sub2{font:600 12.5px/1.4 var(--fu);color:var(--mk-body);text-shadow:var(--ts);white-space:nowrap}

.mk .sub b,.mk .sub2 b{color:#fff;font-weight:800}.mk .sub em,.mk .sub2 em{font-style:normal;color:var(--mk-label);font-weight:800}.mk .sub2 .g{color:var(--ok);font-weight:800}

.mk svg.chart{display:block;margin-top:6px;overflow:visible}
.mk .empty{margin-top:8px;padding:12px 14px;font:600 12.5px/1.4 var(--fu);color:var(--mk-note);background:rgba(255,255,255,.04);border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}

.mk .need{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.mk .need.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.mk .need:empty{display:none}
.mk .tile{position:relative;padding:8px 10px 9px 12px;min-width:0}
.mk .tile::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:4px;transform:skewX(-12deg);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.mk .tile.hot::before{background:linear-gradient(100deg,rgba(245,165,36,.2),rgba(255,214,107,.08));box-shadow:inset 0 0 0 1px rgba(255,214,107,.45)}
.mk .tile small{display:block;font:800 italic 10.5px/1.15 var(--fd);letter-spacing:.06em;color:#9a9cb0;text-transform:uppercase;white-space:nowrap}
.mk .tile small.sq{font-size:9.5px;letter-spacing:0} /* длинная подпись — плотнее */
.mk .tile.hot small{color:var(--mk-label)}
.mk .tile b{display:block;margin-top:5px;font:800 20px/1 var(--fu);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap}
.mk .src{margin:8px 0 0;padding-bottom:14px;font:600 10.5px/1.3 var(--fu);color:var(--mk-src);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk .low{position:relative;z-index:3;padding:0 20px 16px}
/* бой */
.mk .bt-top{position:relative;height:122px}
.mk .bt-top .l{position:absolute;left:20px;top:16px;width:170px;z-index:3}
.mk .bt-top .big{margin-top:9px;font-size:40px}
.mk .bt-top .big i{font-size:21px}
.mk .big .bd{margin-left:8px;font:700 12.5px/1 var(--fu);letter-spacing:0;color:var(--mk-note);text-shadow:var(--ts)}
.mk .row2{display:flex;align-items:center;gap:9px;margin-top:9px}
.mk .dl{display:inline-flex;align-items:center;flex:0 0 auto;height:24px;padding:0 9px;border-radius:3px;transform:skewX(-12deg);font:900 italic 14px/1 var(--fd);font-variant-numeric:tabular-nums;white-space:nowrap}

.mk .dl.dn{background:var(--dn);color:#fff;box-shadow:0 3px 12px rgba(224,41,74,.3)}
.mk .dl.zero{background:rgba(255,255,255,.12);color:#e6e6ef}
.mk .dnote{font:700 12.5px/1 var(--fu);color:var(--mk-note);white-space:nowrap;text-shadow:var(--ts)}
.mk .dmg{position:relative;z-index:3;display:flex;align-items:center;gap:9px;height:34px;padding:0 18px 0 20px}
.mk .tag{display:inline-flex;align-items:center;flex:0 0 auto;height:19px;padding:0 7px;border-radius:2px;transform:skewX(-12deg);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#d8d8e6;font:900 italic 10.5px/1 var(--fd);letter-spacing:.1em;white-space:nowrap}
.mk .chipst>span,.mk .tier>span,.mk .dl>span,.mk .tag>span{transform:skewX(12deg)}
.mk .num{display:inline-block;font:800 30px/1 var(--fu);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);transform-origin:0 70%}
.mk .popslot{position:relative;flex:1 1 auto;align-self:stretch}
.mk .pop{position:absolute;left:4px;top:50%;margin-top:-9px;opacity:0;font:900 italic 17px/1 var(--fd);color:#fff0c4;white-space:nowrap;text-shadow:0 0 12px rgba(245,165,36,.85),0 1px 2px #000}
.mk .pop.as{color:var(--mk-assist);text-shadow:0 0 12px rgba(80,200,255,.8),0 1px 2px #000}
.mk .trkw{position:relative;z-index:3;padding:8px 18px 0 20px}
.mk .trk{position:relative;height:14px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05))}
.mk .trk .zn{position:absolute;top:0;bottom:0}
.mk .trk .zn.plus{background:var(--mk-zone-plus)}.mk .trk .zn.mark{background:var(--mk-zone-mark)}
.mk .trk .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--mk-fill) 0 0/342px 100% no-repeat}
.mk .trk .fill.ok{background:var(--mk-fill-ok) 0 0/342px 100% no-repeat}
.mk .trk .tip{position:absolute;right:0;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 8px #fff,0 0 14px var(--a2)}
.mk .trk .gain{position:absolute;top:0;bottom:0;opacity:0;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.95))}

.mk .trk .nt{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:rgba(10,10,16,.9)}

.mk .nts{position:relative;height:24px}

.mk .nts span.n{left:auto;right:0;transform:none;text-align:right}.mk .nts span.n::before{left:auto;right:0}
.mk .nts span.n b{color:var(--amb)}.mk .nts span.ok b{color:var(--ok)}
.mk .nts span.e.l{transform:translateX(calc(-100% + 4px))}.mk .nts span.e.l::before{left:auto;right:3px}
.mk .foot{position:relative;z-index:3;min-height:16px;padding:2px 18px 13px 20px;font:600 12.5px/1.3 var(--fu);color:#b9bccb;text-shadow:var(--ts)}
.mk .foot b{color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.mk .foot .g{color:var(--ok);font-weight:800}.mk .foot .r{color:#ff7389;font-weight:800}
.mk .foot .fp{display:block;margin-top:4px;font-size:11.5px;color:#8d8fa3}
.mk .burst{position:absolute;left:0;top:0;width:0;height:0;z-index:9}
.mk .burst i{position:absolute;left:-3px;top:-1.5px;width:9px;height:3px;border-radius:2px;opacity:0;background:#fff1cc;box-shadow:0 0 8px #f5a524}
.mk .burst i.g{background:#fff;box-shadow:0 0 8px #fff0c2}
.mk .burst b{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;border:2px solid #fff1cc;box-shadow:0 0 14px #f5a524;opacity:0}
/* компактные */
.mk .cmpb{position:relative;z-index:3;padding:18px 20px 19px}
.mk .cmpb b{display:block;font:900 italic 18px/1.15 var(--fd);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.mk .cmpb span{display:block;margin-top:6px;font:600 12.5px/1.35 var(--fu);color:var(--mk-note)}
</style>

<script>
(() => { // наружу — только крючки проверок
'use strict';
// ===== 0. Параметры и мелочи =====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const Q = new URLSearchParams(location.search);
const DEMO = (() => { if (!Q.has('demo')) return ''; const v = String(Q.get('demo') || '').toLowerCase(); return v === '0' ? '' : !v || v === '1' ? 'loop' : v; })();
const TEST = !DEMO && Q.get('test') === '1';
const DEBUG = Q.get('debug') === '1';
const MEM = !!(DEMO || TEST);                       // пример и проверки — без хранилища
const SPEED = DEMO ? clamp(+Q.get('speed') || 1, .1, 8) : 1;
const MO = window.WR && window.WR.moe;               // формулы и разбор — js/marks-moe.js
const GM_APP = '1e984dbbdf7b1c1fbd284d4cadc0b17f';   // application_id панели, как в obs.html
const WS_URL = 'ws://localhost:38200';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const dbg = s => { if (DEBUG) log(s); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const tagKey = s => String(s || '').split(':').pop().toLowerCase();
const html = s => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content.firstElementChild; };
// пишем в DOM, только если значение другое
const setT = (el, s) => { s = String(s); if (el && el.textContent !== s) el.textContent = s; };
const setH = (el, s) => { if (el && el._h !== s) { el._h = s; el.innerHTML = s; } };
const setA = (el, k, v) => { v = String(v); if (el && el.getAttribute(k) !== v) el.setAttribute(k, v); };
const setS = (el, k, v) => { if (el && el.style[k] !== v) el.style[k] = v; };

const hide = (el, h) => { if (el && el.hidden !== !!h) el.hidden = !!h; };
const fI = v => MO.fmtInt(v), fP = (v, d = 2) => MO.fmtP(v, d), fD = (v, d = 2) => MO.fmtDelta(v, d);
if (MEM && window.MK && MK.cache) MK.cache.use('memory');

// ===== 1. Движение =====
const EASE = { lin: t => t, out2: t => 1 - (1 - t) * (1 - t), out3: t => 1 - Math.pow(1 - t, 3),

const CLK = { live: true, base: performance.now(), t: 0, now() { return this.live ? (performance.now() - this.base) * SPEED : this.t; } };
const TW = new Set();
let RAF = 0, lastStep = 0;
const TIMERS = new Set(); let VQ = [], VN = 0;      // разовые таймеры: живые или виртуальные (seek)
function later(ms, fn) {
  ms = Math.max(0, ms || 0);
