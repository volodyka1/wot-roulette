      // закрепляем за боем только точное совпадение: догадка, пока тег не загружен, может оказаться не тем танком
      if (sp && vehMatch(sp.tank, veh) === true) { b.spId = sp.id; gmSaveBattle(); }
    }
    return { mode: 'battle', sp, all, active, foreign };
  }
  const hv = G.on ? gv('hangar.vehicle.info') : null;
  if (b && b.done && b.spId && Date.now() - b.endAt < GM_AFTER) {
    const sp = all.find(s => s.id === b.spId);
    const other = hv ? gmMatch(active.filter(s => s.id !== b.spId), hv) : null;
    // после боя никто не крутил новый челлендж — показываем итог сыгранного
    const newer = all.some(s => s.id !== b.spId && s.ts > (b.endSrv || serverNow()) + 5000);
    if (sp && !other && !newer) return { mode: 'after', sp, all, active, foreign };
  }
  // только что прокрутили новый спин — показываем его (и подсказку, какой танк выбрать), пока танк в ангаре тот же
  if (G.efHold) {
    // сравниваем только с известным танком: связь с игрой пропала или ангар ещё не прислал танк — это не «сменил танк»
    const h = active.find(s => s.id === G.efHold.id), k = gmHvKey(hv);
    if (h && k && !G.efHold.hv) G.efHold.hv = k;
    if (h && (!k || k === G.efHold.hv)) return { mode: 'hangar', sp: h, picked: vehMatch(h.tank, hv) === true, all, active, foreign };
    G.efHold = null;
  }
  const hit = gmMatch(active, hv);
  if (hit) return { mode: 'hangar', sp: hit, picked: true, all, active, foreign };
  const recent = all[0] && (gmActive(all[0]) || serverNow() - resultTime(all[0]) < TM_OLD) ? all[0] : null;
  return { mode: 'hangar', sp: active[0] || recent, picked: false, all, active, foreign };
}

// --- прогресс: формулы челленджа из каталога на текущих цифрах боя ---
// какие поля статистики читает челлендж — по факту обращений (две прогонки: нули и большие числа)
function gmFields(inst) {
  if (G.fields.has(inst.id)) return G.fields.get(inst.id);
  const used = new Set();
  const spy = val => new Proxy({}, {
    get: (o, k) => { if (typeof k === 'string') used.add(k); return val; },
    has: (o, k) => { if (typeof k === 'string') used.add(k); return true; },
  });
  let res = null;
  try {
    WR.catalog.evaluate(inst, spy(0)); WR.catalog.evaluate(inst, spy(1e9)); WR.catalog.describe(inst, spy(0));
    res = used.size ? used : null;
  } catch (e) { res = null; }
  G.fields.set(inst.id, res);
  return res;
}
const GM_HOLD = ['survived_battles', 'damage_received', 'piercings_received']; // цифры, которые в бою ещё могут испортить итог
// { text, ok, ratio, hold, lost, pp } или null — если челлендж нельзя посчитать по этим цифрам (победа, опыт, медали…)
function gmView(sp, delta, live) {
  if (!delta || !sp.chId || !window.WR || !WR.catalog) return null;
  const inst = { id: sp.chId, v: sp.chV, w: sp.chW };
  const used = gmFields(inst);
  if (!used) return null;
  for (const f of used) if (!(f in delta)) return null;
  let text = String(WR.catalog.describe(inst, delta) || '');
  if (live) text = text.replace(/выжил: да/g, 'пока жив').replace(/выжил: нет/g, 'уничтожен');
  const ok = WR.catalog.evaluate(inst, delta) === true;
  // в бою «выжить / получить мало / не дать пробить» решается только в конце: hold — пока всё держится (но ещё не итог),
  // lost — уже сорвано (уничтожен, пробили, получил много): даже если добрать все цифры, не выполнить
  let hold = false, lost = false;
  if (live && GM_HOLD.some(f => used.has(f))) {
    hold = ok && !(num(delta.survived_battles, 1) < 1); // танк уничтожен — получить урон или пробитие уже нельзя, итог окончательный
    if (!ok) {
      const best = {};
      for (const f of used) best[f] = GM_HOLD.indexOf(f) >= 0 ? delta[f] : 1e9;
      try { lost = WR.catalog.evaluate(inst, best) !== true; } catch (e) { lost = false; }
    }
  }
  // «Урон: 1840 / 3600» в строке результата (только с подписью — «(3/3)» у точности не считаем):
  // «или» — хватит любого, иначе нужно всё. Полная полоса — только когда челлендж выполнен
  const parts = Array.from(text.matchAll(/:\s*(\d+)\s*\/\s*(\d+)/g)).map(x => (+x[2] > 0 ? Math.min(1, +x[1] / +x[2]) : 0));
  let ratio = parts.length ? (/ или /i.test(sp.chFinal) ? Math.max(...parts) : Math.min(...parts)) : null;
  if (ratio != null) ratio = ok ? 1 : Math.min(ratio, 0.97);
  return { text, ok, ratio, hold, lost, pp: efParts(text, sp.chFinal) };
}

// --- модель окна: что показать сейчас ---
function gmModel() {
  if (!G.me) return { idle: G.on ? 'Ищу тебя в комнате…' : 'Подключаюсь…' };
  if (!G.mine.ready) return { idle: 'Загружаю челлендж…' };
  const p = gmPick(), sp = p.sp;
  const names = list => Array.from(new Set(list.map(s => s.tank.name))).join(', ');
  if (p.mode === 'battle' && !sp) {
    return { idle: 'В этом бою челленджа нет', battle: true,
      note: p.active.length ? 'Челлендж на: ' + names(p.active) : 'Крути рулетку на сайте между боями', noteCls: p.active.length ? 'warn' : '' };
  }
  if (!sp) return { idle: 'Крути рулетку — челлендж появится здесь' };
  const st = stOf(sp), m = { sp, mode: p.mode, chip: st, view: null, note: '', noteCls: '' };
  if (p.mode === 'battle') {
    const b = G.bt;
    m.chip = 'battle';
    m.view = sp.auto ? gmView(sp, (b && b.last) || gmLiveDelta(), true) : null;
    if (!sp.auto) m.note = 'Ручной челлендж — итог отметит стример';
    else if (!m.view) m.note = 'Этот челлендж посчитаем после боя';
    else if (b && b.partial) m.note = 'Окно открыли посреди боя — часть цифр не видна';
  } else if (p.mode === 'after') {
    const b = G.bt;
    m.view = sp.auto && b && b.final ? gmView(sp, b.final, false) : null;
    if (st === 'pending') {
      m.chip = 'check';
      if (m.view && b.partial && !b.res) m.note = 'Часть боя окно не видело — ждём итог боя и проверку';
      else if (m.view) {
        m.note = m.view.ok ? 'По данным игры — выполнено. Ждём проверку' : 'По данным игры — не выполнено. Ждём проверку';
        m.noteCls = m.view.ok ? 'good' : 'bad';
      } else m.note = 'Бой сыгран — проверяем итог';
    } else if (!m.view || sp.resultText !== m.view.text) m.note = m.view && sp.resultText ? 'Проверка: ' + sp.resultText : sp.resultText; // итог проверки — если он не повторяет цифры игры
  } else if (st === 'pending') {
    m.chip = 'wait';
    if (G.on) {
      if (p.picked) { m.note = '✓ Танк выбран — в бой!'; m.noteCls = 'good'; }
      else { // танк, который уже выбран в ангаре (у него свой челлендж), в подсказку не попадает
        const hv = gv('hangar.vehicle.info');
        m.note = 'Выбери в ангаре: ' + (names(p.active.filter(s => vehMatch(s.tank, hv) !== true)) || sp.tank.name); m.noteCls = 'warn'; m.off = true;
      }
    } else if (p.active.length > 1) m.note = 'Ещё челленджи на: ' + names(p.active.filter(s => s !== sp));
  } else m.note = sp.resultText;
  if (p.foreign) { m.note = 'В игре другой аккаунт, не из этой ссылки — его бои сюда не засчитаются'; m.noteCls = 'warn'; }
  return m;
}
// --- «Эфир»: окно в стиле плашки со стрима ---
const EF_RW = 360, EF_CW = 92, EF_STEP = 100, EF_SLIDE = 114; // окно 360, карточка ленты 92 + зазор 8; после посадки едет влево на 114
const EF_OUT = 'cubic-bezier(.16,1,.3,1)', EF_SPRING = 'cubic-bezier(.2,1.6,.4,1)';
const efFmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const efX = i => EF_RW / 2 - (i * EF_STEP + EF_CW / 2); // сдвиг ленты, при котором карточка i стоит под маркером
// подписи счётчиков и единицы для «ещё N …» по строке результата каталога («Урон: 1840 / 3600»)
const EF_TAGS = { 'урон': 'УРОН', 'фраги': 'ФРАГИ', 'засвечено': 'ЗАСВЕТ', 'по засвету': 'ПО ЗАСВЕТУ', 'по гусле': 'ПО ГУСЛЕ',
  'заблокировано': 'БЛОК', 'оглушений': 'ОГЛУШЕНИЯ', 'урон по оглушению': 'ОГЛУШЕНИЕ', 'пробитий': 'ПРОБИТИЯ',
  'непробитий': 'НЕПРОБИТИЯ', 'попаданий': 'ПОПАДАНИЯ', 'попаданий фугасами': 'ФУГАСЫ', 'помощь': 'ПОМОЩЬ', 'вклад': 'ВКЛАД',
  'очки захвата': 'ЗАХВАТ', 'сбито': 'СБИТО', 'опыт': 'ОПЫТ' };
const EF_UNITS = { 'урон': 'урона', 'по засвету': 'урона', 'по гусле': 'урона', 'заблокировано': 'урона', 'урон по оглушению': 'урона',
  'помощь': 'урона', 'вклад': 'урона', 'опыт': 'опыта', 'фраги': ['фраг', 'фрага', 'фрагов'], 'засвечено': ['противник', 'противника', 'противников'],
  'оглушений': ['оглушение', 'оглушения', 'оглушений'], 'пробитий': ['пробитие', 'пробития', 'пробитий'],
  'непробитий': ['непробитие', 'непробития', 'непробитий'], 'попаданий': ['попадание', 'попадания', 'попаданий'],
  'попаданий фугасами': ['попадание', 'попадания', 'попаданий'], 'очки захвата': ['очко', 'очка', 'очков'], 'сбито': ['очко', 'очка', 'очков'] };
// «Урон: 1840 / 4800 или фраги: 1 / 4, выжил: да» → счётчики { key, tag, cur, max, pct }, «или» и остаток текста
function efParts(text, chFinal) {
  const parts = [], rest = [];
  String(text || '').split(/,\s+|\s+или\s+/).forEach(seg => {
    const m = seg.match(/^\s*([^:]+?):\s*(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*$/);
    if (!m) { if (seg.trim()) rest.push(seg.trim()); return; }
    const key = m[1].trim().toLowerCase(), cur = +m[2], max = +m[3];
    parts.push({ key, tag: EF_TAGS[key] || key.split(' ')[0].toUpperCase(), cur, max, pct: max > 0 ? Math.min(100, Math.floor(cur * 100 / max)) : 0 });
  });

const efLead = pp => pp.parts.reduce((b, p, i, a) => (p.max > 0 && p.cur / p.max > a[b].cur / Math.max(1, a[b].max) ? i : b), 0);

  const n = Math.max(0, Math.round(p.max - p.cur)), u = EF_UNITS[p.key];
  return `ещё <b>${efFmt(n)}</b>` + (u ? ' ' + (Array.isArray(u) ? plural(n, u[0], u[1], u[2]) : u) : '');
}

// разметка
const efTier = t => `<span class="ef-tier"><span>${ROMAN[t.tier]}</span></span>`;

const efCard = (t, win) => `<div class="ef-tc rar-${RAR(t.tier)}${t.type ? ' ct-' + t.type : ''}${win ? ' win' : ''}"><b>${ROMAN[t.tier]}</b>`
  + (t.type ? `<u>${TYPES[t.type]}</u>` : '') + (t.img ? `<img src="${esc(t.img)}" alt="" decoding="async" ${IMG_ERR}>` : '') + '</div>';
const efShell = (cls, t, inner) => `<div class="ef ${cls}${t ? ' rar-' + RAR(t.tier) : ''}"><i class="ef-sh"></i><div class="ef-bg">`

// лента: в покое — одна карточка победителя у левого края (как в конце прокрута)
const efBand = (t, list, still, sbox) => `<div class="ef-band"><i class="ef-wash"></i><div class="ef-reel"><i class="ef-lines"></i>`
  + `<div class="ef-strip"${still ? ' style="transform:translate3d(20px,0,0)"' : ''}>${list.map(x => efCard(x, still)).join('')}</div></div>`
  + `<div class="ef-mark"><i></i><b></b></div><i class="ef-ring"></i><i class="ef-flash"></i>`
  + `<div class="ef-id"><div class="ef-meta">${efTier(t)}${efCls(t)}</div><div class="ef-name">${esc(t.name)}</div></div>`
  + `<div class="ef-sbox">${sbox || ''}</div></div>`;
const efFlap = (txt, cls) => `<div class="ef-ch"><div class="ef-lbl">ЧЕЛЛЕНДЖ НА БОЙ</div><div class="ef-flap ${cls}"><div class="txt">${esc(txt)}</div><i class="sw"></i></div></div>`;
const efCht = txt => `<div class="ef-cht">${esc(txt)}</div>`;
const efSt = (chip, label, note, nc) => `<div class="ef-st">${chip ? `<span class="ef-chip ${chip}"><span><i></i><em>${label}</em></span></span>` : ''}`
  + `<span class="ef-note ${nc || ''}">${esc(note || '')}</span></div>`;
const efStamp = (ok, fx) => `<div class="ef-stamp ${ok ? 'ok' : 'fail'}${fx ? ' fx' : ''}"><span>${ok ? ICON_OK : ICON_FAIL}${ok ? 'ВЫПОЛНЕНО' : 'ПРОВАЛ'}</span><i class="streak"></i></div>`;
function efMeter(p, cls, done) {

  const full = p.max > 0 && p.cur >= p.max; // зелёная полоса — только у набранного счётчика (в «или» второй остаётся как есть)

    + `<span class="ef-val"><b class="ef-num">${efFmt(p.cur)}</b><span class="ef-of">/ ${efFmt(p.max)}</span></span><b class="ef-pop"><i></i></b><span class="ef-pct">${p.pct}%</span></div>`

function efBody(s, small) {
  const v = s.view, pp = v && v.pp;

  const lead = efLead(pp);
  const html = pp.or
    ? pp.parts.map((p, i) => efMeter(p, (i === lead ? 'lead' : 'dim') + (small ? ' sm' : ''), v.ok)).join('<div class="ef-or">ИЛИ — ХВАТИТ ЛЮБОГО</div>')
    : pp.parts.map(p => efMeter(p, small || pp.parts.length > 1 ? 'sm' : '', v.ok)).join('');

}
// строка под счётчиками в бою
function efFoot(s) {

  if (!v) return extra;
  if (s.done) return `<span class="good">✓ Выполнено${s.dead ? '' : ' — доиграй бой'}</span>` + (extra ? '<br>' + extra : '');
  // цифры уже набраны, а челлендж ещё нет (не выжил, получил много) — подсказки «ещё 0» нет, условие видно строкой выше
  let main = '';

  else if (v.lost) main = '<span class="bad">В этом бою уже не выполнить</span>';

// --- крупная картинка танка в бою: рендер из танковедения WG по тегу танка (600×438, прозрачный фон, CORS открыт) ---
const EF_HERO = 'https://eu-wotp.wgcdn.co/dcont/tankopedia_images/';

const EF_BOX = new Map();         // адрес картинки -> где на ней сам танк { w, h, x0, y0, x1, y1 }
// танк, на котором сейчас играют (тег из игры), иначе тег танка челленджа из WG API; тега нет — '' (покажем маленькую иконку)
function efHeroUrl(sp) {
  const veh = (G.bt && G.bt.veh) || (G.on ? gv('battle.vehicle') : null);
  const raw = (veh && typeof veh === 'object' && typeof veh.tag === 'string' && veh.tag) || G.tags.get(String(sp.tank.id)) || '';
  const tag = String(raw).split(':').pop().toLowerCase();

}
// где на картинке танк: по непрозрачным точкам (мягкую тень вокруг не считаем). Прочитать нельзя — типичная рамка
function efHeroBox(img) {
  const w = img.naturalWidth || 600, h = img.naturalHeight || 438;
  if (w <= 200) return { w, h, x0: 0, y0: 0, x1: w, y1: h }; // маленькая иконка из спина занимает весь кадр
  try {

    }
    if (x1 - x0 > w * .15 && y1 - y0 > h * .15) return { w, h, x0, y0, x1, y1 };
  } catch (e) {}

}
// танк вписан в коробку: по центру, низ на низ; зеркально — в рендерах WG танк смотрит влево, а нам нужно на челлендж
function efHeroCss(b) {

    + `top:${(EF_TKH - b.y1 * k).toFixed(1)}px;transform:scaleX(-1)`;
}
function efHeroImg(url, fb) {
  const src = url || fb || '';
  if (!src) return '';
  const b = EF_BOX.get(src); // эту картинку уже мерили — ставим сразу, без мигания при пересборке карточки
  return `<img alt="" decoding="async"${url ? ` crossorigin="anonymous" data-fb="${esc(fb || '')}"` : ''} src="${esc(src)}"`
    + (b ? ` class="on" style="${efHeroCss(b)}"` : '') + ' onload="efHeroLoad(this)" onerror="efHeroErr(this)">';

function efHeroLoad(img) {
  const src = img.getAttribute('src');

    // бой только начался — танк въедет в рамку, когда загрузится картинка (при пересборке той же карточки не повторяем)
    if (s.layout === 'bt' && !vals) {
      const pic = card.querySelector('.ef-tk img');
      if (pic) { card.dataset.enter = '1'; if (pic.complete && pic.naturalWidth) efHeroLoad(pic); }
    }
    if (G.efPop) { G.efPop = false; const row = card.querySelector('.ef-st'); if (row) row.classList.add('pop'); }
    if (cel) efCelebrate(card); else if (s.fx) efFlashHL(card);
  } else if (s.layout !== 'idle') efUpdate(box.firstElementChild, s);
  G.efShown = s.layout === 'idle' ? null : { id: s.sp.id, ch: s.sp.chFinal, st: s.sp.status };
}
function efZoom() { // окно свёрстано в 360 px — целиком вписываем в ширину, которую выставили в игре (уже — мельче, но без обрезки)
  const z = Math.max(.25, Math.min(3, (innerWidth || EF_RW) / EF_RW));
  $('#game').style.zoom = String(Math.round(z * 1000) / 1000);
}

function gmRender() {
  if (!G.anim && G.spinQ) {
    const raw = G.mine.spins.get(G.spinQ);
    G.spinQ = '';
    if (raw && !gmInBattle()) efSpinPlay(norm(raw)); // в бою барабан не крутим — спин просто появится в ангаре
  }
  if (!G.anim) efRenderMe(gmModel());
  gmRenderFriends();
  const off = !GM_DEMO && !G.on && Date.now() - G.t0 > 8000;
  const hint = $('#gmHint');
  hint.hidden = !off;
  if (off && !hint.textContent) hint.textContent = 'Нет связи с игрой — нужен мод WotStat «Виджеты»';
}
function gmRenderFriends() {
  let html = '';
  if (GM_FRIENDS) G.frOrder.forEach(acc => {
    const f = G.fr.get(acc);
    if (!f || !f.ready) return;
    const all = gmSpins(f);
    const sp = all.find(s => !s.status || s.status === 'pending')
      || (all[0] && (gmActive(all[0]) || serverNow() - resultTime(all[0]) < TM_OLD) ? all[0] : null);
    if (!sp) return;
    const st = stOf(sp);
    const s = st === 'ok' ? ['✓', 'ok'] : st === 'fail' ? ['✕', 'fail'] : st === 'ambiguous' ? ['?', 'amb'] : ['⏳', 'pend'];
    html += `<div class="ef-fr"><span class="n">${esc(f.nick)}</span><span class="c"><b>${esc(sp.tank.name)}</b> · ${esc(sp.chFinal)}</span>`
      + `<span class="s ${s[1]}"><span>${s[0]}</span></span></div>`;
  });
  if (html !== G.frHTML) { G.frHTML = html; $('#gmFrs').innerHTML = html; }
}
let gmT = 0;
function gmSoon() { if (!gmT) gmT = setTimeout(() => { gmT = 0; try { gmRender(); } catch (e) { console.error(e); } }, 100); }

// &demo=1 — по кругу: прокрут рулетки, ангар, бой понарошку, итог — чтобы посмотреть окно без игры.
// &demo=hangar|wrong|battle|after|ok|fail — застыть на одном виде (удобно заранее расставить окно в игре):
// ангар с нужным танком / с другим танком, середина боя, сразу после боя, итог засчитан / провален.
// &demo=spin — прокрут рулетки в ангаре, повторяется каждые 12 секунд.
// Всё только в памяти страницы, в комнату ничего не пишется
const GM_STAGES = ['hangar', 'wrong', 'battle', 'after', 'ok', 'fail', 'spin'];
function gmDemo() {
  const stage = GM_STAGES.indexOf(params.get('demo')) >= 0 ? params.get('demo') : '';
  const send = m => gmMsg(JSON.parse(JSON.stringify(m)));
  const set = (path, value) => send({ type: 'state', path, value });
  const fb = (type, data) => send({ type: 'trigger', path: 'battle.onPlayerFeedback', value: { type, data } });
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  (async () => {
    while (!G.me || !G.mine.ready || !(window.WR && WR.catalog)) await sleep(300);
    for (;;) {
      if (!stage) G.bt = null; // новый круг — снова ангар, а не итог прошлого боя
      let p = gmPick();
      if (!p.active.length) { gmDemoSpin(p.all[0]); p = gmPick(); }
      const sp = p.active[0] || p.sp, t = sp.tank;
      gmTag(t);
      for (let i = 0; i < 12 && !G.tags.has(String(t.id)); i++) await sleep(300);
      const tg = G.tags.get(String(t.id));
      const veh = { tag: tg ? 'demo:' + tg : '', localizedName: t.name, localizedShortName: t.name, level: t.tier, class: t.type, role: '' };
      const other = { tag: 'demo:other_tank', localizedName: 'Другой танк', localizedShortName: 'Другой танк', level: t.tier, class: t.type, role: '' };
      const hp = t.hp || 1800;
      send({ type: 'init', states: [
        { path: 'player.id', value: +G.me }, { path: 'game.state', value: 'hangar' },
        { path: 'hangar.vehicle.info', value: stage === 'wrong' ? other : veh }, { path: 'battle.isInBattle', value: false },
      ] });
      if (stage === 'hangar' || stage === 'wrong') return;
      if (stage === 'spin') for (;;) { G.spinQ = sp.id; gmSoon(); await sleep(12000); }
      if (!stage) { G.spinQ = sp.id; gmSoon(); await sleep(400); while (G.anim) await sleep(200); } // круг начинается с прокрута
      await sleep(stage ? 300 : 4000);
      const arena = Date.now();
      set('battle.arenaId', arena); set('battle.vehicle', veh); set('battle.maxHealth', hp); set('battle.health', hp); set('battle.isAlive', true);
      ['damage', 'assist', 'blocked', 'stun'].forEach(k => set('battle.efficiency.' + k, 0));
      set('battle.isInBattle', true);
      let dmg = 0, assist = 0, blocked = 0, health = hp, kills = 0, spotted = 0, n = 0;
      const hit = d => { dmg += d; set('battle.efficiency.damage', dmg); fb('damage', { damage: d, attackReason: 'shot', vehicle: { playerId: 900 + (n++ % 15) } }); };
      const kill = () => { kills++; fb('kill', { vehicle: { playerId: 3000 + kills } }); };
      if (stage) {
        // одна и та же картинка: в бою — около 60% урона и два фрага, к концу боя — челлендж выполнен
        const v = sp.chV > 0 ? sp.chV : 3000;
        [0.21, 0.17, 0.23].forEach(f => hit(Math.round(v * f)));
        kill(); kill();
        for (let i = 1; i <= 3; i++) { spotted++; fb('spotted', { isVisible: true, vehicle: { playerId: 2000 + i } }); }
        assist = 640; set('battle.efficiency.assist', assist); fb('radioAssist', { damage: assist, attackReason: 'shot', vehicle: { playerId: 901 } });
        blocked = 880; set('battle.efficiency.blocked', blocked); fb('tanking', { damage: blocked, attackReason: 'shot', vehicle: { playerId: 902 } });
        health = Math.round(hp * 0.55); set('battle.health', health); fb('receivedDamage', { damage: hp - health, attackReason: 'shot', vehicle: { playerId: 903 } });
        if (stage === 'battle') return;
        await sleep(400);
        if (stage !== 'fail') { [0.25, 0.2].forEach(f => hit(Math.round(v * f))); kill(); }
        else { // провал: урона не добрали, танк уничтожили
          fb('receivedDamage', { damage: health, attackReason: 'shot', vehicle: { playerId: 904 } });
          health = 0; set('battle.health', 0); set('battle.isAlive', false);
        }
      } else {
        for (let i = 0; i < 24 && health > 0; i++) {
          await sleep(1000);
          const x = Math.random(), en = { playerId: 900 + (n++ % 15) };
          if (x < 0.4) hit(R(240, 620));
          else if (x < 0.55) { spotted++; fb('spotted', { isVisible: true, vehicle: { playerId: 2000 + spotted } }); }
          else if (x < 0.64) kill();
          else if (x < 0.75) { const d = R(150, 450); assist += d; set('battle.efficiency.assist', assist); fb('radioAssist', { damage: d, attackReason: 'shot', vehicle: en }); }
          else if (x < 0.87) { const d = R(200, 500); blocked += d; set('battle.efficiency.blocked', blocked); fb('tanking', { damage: d, attackReason: 'shot', vehicle: en }); }
          else {
            const d = R(150, 400);
            health = Math.max(0, health - d); set('battle.health', health); fb('receivedDamage', { damage: d, attackReason: 'shot', vehicle: en });
            if (!health) set('battle.isAlive', false);
          }
        }
      }
      set('battle.isInBattle', false);
      await sleep(stage ? 300 : 2500);
      send({ type: 'trigger', path: 'battle.onBattleResult', value: { arenaUniqueID: arena, common: { winnerTeam: 1 }, personal: {
        avatar: { team: 1 },
        [String(t.id || 1)]: { damageDealt: dmg, kills, spotted, damageAssistedRadio: assist, damageAssistedTrack: 0, damageAssistedStun: 0,
          damageBlockedByArmor: blocked, damageReceived: hp - health, shots: 15, directEnemyHits: 12, piercingEnemyHits: 10,
          explosionHits: 0, noDamageDirectHitsReceived: 3, piercingsReceived: 4, capturePoints: 0, droppedCapturePoints: 0,
          stunNum: 0, deathReason: health > 0 ? -1 : 0 },
      } } });
      if (stage === 'after') return;
      if (stage === 'ok' || stage === 'fail') {
        // как будто проверка в панели уже записала итог (только в памяти этой страницы)
        await sleep(300);
        const raw = G.mine.spins.get(sp.id), view = G.bt && G.bt.final ? gmView(sp, G.bt.final, false) : null;
        if (raw) gmSpinEv(G.mine, 'changed', Object.assign({}, raw, { status: stage, result: { text: view ? view.text : '', checkedAt: serverNow(), by: 'auto' } }));
        return;
      }
      await sleep(15000);
    }
  })();
}
// пример челленджа для показа, если своего сейчас нет: только в памяти
function gmDemoSpin(base) {
  const t = (base && base.tank) || { id: 35873, name: 'Hacker', tier: 11, type: 'mediumTank', hp: 2100 };
  const tank = { id: t.id, name: t.name, tier: t.tier, type: t.type || 'mediumTank', prem: !!t.prem, img: t.img || '', hp: t.hp || 1800 };
  let ch = { id: 'dmg_or_frags', text: 'Нанести 3000 урона или уничтожить 3 противника', auto: true, v: 3000, w: 3 }, flips = [];
  try {
    const all = WR.catalog.instancesFor(tank, { difficulty: 'normal' }), inst = all.find(i => i.id === 'dmg_or_frags');
    if (inst) ch = { id: inst.id, text: inst.text, auto: true, v: inst.v, w: inst.w };
    flips = all.map(i => i.text).filter(x => x && x !== ch.text).sort(() => Math.random() - 0.5).slice(0, 7); // табло перелистает перед итогом
  } catch (e) {}
  // лента прокрута: настоящая из последнего спина с этим танком, иначе танки из недавних спинов комнаты
  let items = null, winIndex = 0;
  if (base && base.items.length > 1 && base.items[base.winIndex] && base.items[base.winIndex].id === tank.id) { items = base.items; winIndex = base.winIndex; }
  else {
    const pool = new Map();
    [G.mine].concat([...G.fr.values()]).forEach(c => c.spins.forEach(r => {
      const n = norm(r);
      n.items.concat([n.tank]).forEach(x => { if (x.img && String(x.id) !== String(tank.id)) pool.set(String(x.id), x); });
    }));
    const list = [...pool.values()].sort(() => Math.random() - 0.5);
    if (list.length) { items = Array.from({ length: 22 }, (_, i) => list[i % list.length]); winIndex = 18; items[winIndex] = tank; }
  }
  gmSpinEv(G.mine, 'added', { id: 'demo-spin', acc: G.me, nick: 'demo', owner: true, ts: serverNow(), tank, items: items || [tank], winIndex,
    challenge: ch, ch: flips.concat([ch.text]), status: 'pending' }, true); // барабан крутит сам демо, когда нужно
}

function startGame() {
  $('#game').hidden = false;
  efZoom();
  addEventListener('resize', efZoom);
  const s = document.createElement('script');
  s.src = GM_CATALOG;
  s.onload = () => { G.fields.clear(); G.key = ''; gmSoon(); };
  document.head.appendChild(s);
  // окно перезагрузилось: бой, который ещё идёт (не старше 30 минут), или недавний итог
  const saved = gmLoadBattle();
  if (saved && (saved.done ? Date.now() - saved.endAt < GM_AFTER : Date.now() - saved.at < 30 * 60000)) G.bt = saved;
  if (GM_URL_ACC) gmSetMe(GM_URL_ACC, 'url');
  startRoster(gmRoster);
  if (GM_DEMO) gmDemo(); else gmConnect();
  setInterval(() => { gmFallback(); gmSoon(); efZoom(); }, 2000); // подсказки по времени; «после боя» гаснет сам; ширину окна в игре меняют на ходу
  gmSoon();
}

// ---------- Запуск ----------
(function boot() {
  if (W === 'main') { if (ROOM) startMainRoom(); else startMainLocal(); return; }
  if (!ROOM) { console.warn('[obs] для этого виджета нужен параметр ?room=ID'); return; }
  if (W === 'feed') startFeed();
  else if (W === 'team') startTeam();
  else if (W === 'series') startSeries();
  else if (W === 'game') startGame();
  else startBoard();
})();

// «Команда» и «Серия» вписываются в любой размер источника OBS: целиком, по центру, без обрезки
(function autoFit() {
  const base = { team: [960, 320], series: [560, 300] }[W];
  const el = base && document.getElementById(W);
  if (!el) return;
  el.style.maxWidth = 'none';
  el.style.transformOrigin = '0 0';
  const fit = () => {
    if (!innerWidth || !innerHeight) return;
    const s = Math.min(innerWidth / base[0], innerHeight / base[1], 2);
    el.style.transform = Math.abs(s - 1) < 0.005 ? '' : `scale(${s})`;
    el.style.marginLeft = Math.max(0, Math.round((innerWidth - base[0] * s) / 2)) + 'px';
  };
  addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  setInterval(fit, 2000); // подстраховка: размер источника в OBS меняют на ходу
  fit();
})();

// Основной виджет: размер источника поменяли на ходу — ставим ленту обратно под маркер
(function mainRealign() {
  if (W !== 'main') return;
  addEventListener('resize', () => {
    const sp = M.shown;
    if (!sp || !$('#strip').children.length || $('#reel').classList.contains('spinning')) return;
    try {
      const m = reelTarget(sp);
      R.cards = Array.from($('#strip').children); R.reelW = m.reelW; R.cw = m.cw; R.step = m.step;
      setX(m.x);
      $('#reel').style.setProperty('--wx', (m.reelW / 2 - sp.jitter * m.cw) + 'px');
    } catch (e) {}
  });
})();

// Автообновление: на сайте вышла новая версия — перезагружаемся сами (OBS иначе держит старую копию в кэше).
// Сравниваем с датой загруженного документа: OBS мог достать из кэша старую страницу уже после выхода новой
(function autoUpdate() {
  if (!/^https?:$/.test(location.protocol)) return;
  const docLM = Date.parse(document.lastModified);
  const probe = () => fetch(location.pathname + '?_probe=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
    .then(r => (r.ok ? { tag: r.headers.get('etag') || '', lm: Date.parse(r.headers.get('last-modified') || '') } : null))
    .catch(() => null);
  const reload = () => {
    // окно в игре не перезагружаем посреди боя — обновимся на следующей проверке, уже в ангаре
    if (W === 'game' && gmInBattle()) return;
    // защита от зацикливания: не чаще раза в 10 минут
    try {
      const last = +sessionStorage.getItem('wrUpd') || 0;
      if (Date.now() - last < 600000) return;
      sessionStorage.setItem('wrUpd', String(Date.now()));
    } catch (e) {}
    const u = new URL(location.href);
    u.searchParams.set('_v', String(Date.now())); // мимо кэша CDN
    location.replace(u.toString());
  };
  let base = '';
  const check = () => probe().then(v => {
    if (!v) return;
    if (isFinite(docLM) && isFinite(v.lm)) { if (v.lm > docLM + 1000) reload(); return; }
    // нет дат — по ETag: первая удачная проверка становится точкой отсчёта
    if (!v.tag) return;
    if (!base) { base = v.tag; return; }
    if (v.tag !== base) reload();
  });
  check();
  setInterval(check, 120000);
})();
