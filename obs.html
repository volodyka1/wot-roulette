<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рулетка OBS</title>
<!--
  Виджеты для OBS (Источник → Браузер). Фон прозрачный, кликать нечего.
    obs.html?room=ID                 основной: спины стримера, 760x320 (&size=big — 1920x460)
    obs.html?room=ID&w=feed          лента друзей, 480x600
    obs.html?room=ID&w=board         таблица, 480x420 (всё с последнего «Обнулить»; &period=today — только сегодня)
    obs.html?room=ID&w=team          команда: стример в центре, два друга по бокам, 960x320
    obs.html?room=ID&w=series        серия выполнений/провалов, 560x300 (всё с последнего «Обнулить»; &period=today — только сегодня)
    obs.html                         основной без комнаты: опрос /api/state локального сервера
  Звук: основной и команда — WebAudio (&mute выключает), лента, таблица и серия молчат (&sound=1 включает).
-->
<script>
(function () {
  var p = new URLSearchParams(location.search), w = (p.get('w') || p.get('obs') || 'main').toLowerCase();
  if (w !== 'feed' && w !== 'board' && w !== 'team' && w !== 'series') w = 'main';
  document.documentElement.className = 'w-' + w + (p.get('size') === 'big' ? ' big' : '');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --s0:#0d0d13; --s1:#121219; --s2:#181822; --s3:#20202c; --s4:#2a2a39;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --text:#f3f3f8; --muted:#8d8da3; --dim:#5c5c70;
  --a1:#ff3d5a; --a2:#ff8a3d; --grad:linear-gradient(100deg,#ff3d5a 0%,#ff8a3d 100%);
  --a-glow:rgba(255,61,90,.38); --a-soft:rgba(255,61,90,.14);
  --ok:#2ee59d; --ok2:#14b877; --fail:#ff3d5a; --fail2:#c0163a; --amb:#ffb627; --amb2:#e08a00;
  --out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --fd:Montserrat,Inter,system-ui,sans-serif; --fu:Inter,system-ui,sans-serif;
  --rc:#ff3d5a; --rc2:#ffb0bd; --rcg:rgba(255,61,90,.45); --rcs:rgba(255,61,90,.14);
  /* основной виджет, компактный размер (760x320) */
  --cw:124px; --chh:140px; --gap:10px; --reel-h:168px; --pl-h:132px; --st-gap:10px;
}
html.big{--cw:176px;--chh:188px;--gap:14px;--reel-h:252px;--pl-h:176px;--st-gap:14px}
.rar-r1{--rc:#5f93d6;--rc2:#b6d3f8;--rcg:rgba(95,147,214,.5);--rcs:rgba(95,147,214,.14)}
.rar-r2{--rc:#9b5cff;--rc2:#d4b9ff;--rcg:rgba(155,92,255,.55);--rcs:rgba(155,92,255,.15)}
.rar-r3{--rc:#ff2d6f;--rc2:#ffa3c1;--rcg:rgba(255,45,111,.55);--rcs:rgba(255,45,111,.15)}
.rar-r4{--rc:#ffb627;--rc2:#ffe49e;--rcg:rgba(255,182,39,.55);--rcs:rgba(255,182,39,.15)}
.ct-lightTank{--cc:#3ddc84;--ccs:rgba(61,220,132,.14)}
.ct-mediumTank{--cc:#ffcf3f;--ccs:rgba(255,207,63,.14)}
.ct-heavyTank{--cc:#ff6150;--ccs:rgba(255,97,80,.14)}
.ct-AT-SPG{--cc:#4aa8ff;--ccs:rgba(74,168,255,.14)}
.ct-SPG{--cc:#c18cff;--ccs:rgba(193,140,255,.14)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:transparent!important;overflow:hidden}
body{color:var(--text);font:14px/1.4 var(--fu);-webkit-font-smoothing:antialiased;pointer-events:none;user-select:none}
#fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:30}
.w-main #feed,.w-main #board,.w-feed #main,.w-feed #board,.w-board #main,.w-board #feed{display:none!important}

/* ---------- Основной: рулетка ---------- */
#main{position:relative;display:flex;flex-direction:column;gap:var(--st-gap);padding-top:4px}
html.big #main{padding-top:12px}
.reel-wrap{position:relative;will-change:transform}
.reel{position:relative;height:var(--reel-h);border-radius:16px;overflow:hidden;isolation:isolate;
  background:radial-gradient(55% 140% at 50% 50%,#1c1c28 0%,#101017 60%,#0b0b10 100%);
  box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
html.big .reel{border-radius:22px}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:2px;z-index:6;background:linear-gradient(90deg,transparent,var(--a1) 30%,var(--a2) 70%,transparent);opacity:.7}
.reel::before{top:0}.reel::after{bottom:0}
.rays{position:absolute;top:50%;left:var(--wx,50%);width:560px;height:560px;margin:-280px 0 0 -280px;z-index:0;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,transparent 0deg 7deg,var(--rcg) 9deg 12deg,transparent 14deg 22deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 15%,transparent 100%);mask-image:radial-gradient(closest-side,#000 15%,transparent 100%);
  transition:opacity .8s var(--out)}
html.big .rays{width:760px;height:760px;margin:-380px 0 0 -380px}
.reel.won .rays{opacity:.85;animation:spinr 18s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.track{position:absolute;inset:0;overflow:hidden;z-index:1}
.track.mb1{filter:url(#mb1)}.track.mb2{filter:url(#mb2)}.track.mb3{filter:url(#mb3)}
.strip{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:var(--gap);will-change:transform}
.speedfx{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 13px,rgba(255,255,255,.05) 13px 14px,transparent 14px 31px,rgba(255,170,140,.06) 31px 32px);
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 35%,transparent 65%,#000);mask-image:linear-gradient(90deg,#000,transparent 35%,transparent 65%,#000)}
.fade{position:absolute;top:0;bottom:0;width:14%;z-index:3;pointer-events:none}
.fade.l{left:0;background:linear-gradient(90deg,#0b0b10 5%,rgba(11,11,16,0))}
.fade.r{right:0;background:linear-gradient(-90deg,#0b0b10 5%,rgba(11,11,16,0))}
.vig{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .9s var(--out);
  background:radial-gradient(170px 150% at var(--wx,50%) 50%,transparent 58%,rgba(6,6,10,.8) 100%)}
.reel.won .vig{opacity:1}
#flash{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;background:radial-gradient(40% 90% at var(--wx,50%) 50%,rgba(255,255,255,.75),rgba(255,180,150,.15) 60%,transparent)}
.marker{position:absolute;top:0;bottom:0;left:50%;width:0;z-index:5;pointer-events:none}
.marker .beam{position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:linear-gradient(180deg,#fff,#ffe1d6 50%,#fff);box-shadow:0 0 10px #fff,0 0 22px var(--a1),0 0 46px var(--a2)}
.marker .halo{position:absolute;top:0;bottom:0;left:-30px;width:60px;background:linear-gradient(90deg,transparent,rgba(255,90,90,.16),transparent)}
.marker .mflash{position:absolute;top:0;bottom:0;left:-20px;width:40px;opacity:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
.glint{position:absolute;left:-20px;width:40px;height:40px;animation:glint 2.6s ease-in-out infinite}
.glint.t{top:-20px}.glint.b{bottom:-20px;animation-delay:-1.3s}
.glint::before,.glint::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff,0 0 18px var(--a2)}
.glint::before{width:40px;height:2px;margin:-1px 0 0 -20px}
.glint::after{width:2px;height:40px;margin:-20px 0 0 -1px}
.glint i{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(#fff,rgba(255,138,61,.6) 45%,transparent 70%)}
@keyframes glint{0%,100%{transform:scale(.75) rotate(0);opacity:.75}50%{transform:scale(1.08) rotate(45deg);opacity:1}}

/* ---------- Карточка танка ---------- */
.tcard{position:relative;flex:0 0 var(--cw);width:var(--cw);height:var(--chh);will-change:transform;backface-visibility:hidden}
.tcard.win{z-index:4}
.tc-in{position:absolute;inset:0;border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 108%,var(--rcs),transparent 70%),linear-gradient(180deg,#1d1d29,#111118);
  border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 30px rgba(0,0,0,.45)}
.tc-in::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--rc),var(--rc2),var(--rc))}
.tc-tier{position:absolute;top:7px;left:10px;font:900 italic 19px/1 var(--fd);letter-spacing:-.03em;color:var(--rc2);text-shadow:0 0 16px var(--rcg)}
.ctag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:var(--ccs);color:var(--cc);border:1px solid var(--cc);font:800 10.5px/1 var(--fu);letter-spacing:.06em;white-space:nowrap}
.tc-in .ctag{position:absolute;top:8px;right:8px;height:17px;padding:0 5px;font-size:9.5px}
.tc-in img{position:absolute;left:50%;top:30px;width:112px;height:70px;margin-left:-56px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.65))}
.tc-nm{position:absolute;left:8px;right:8px;bottom:11px;text-align:center;font:800 italic 12px/1.15 var(--fd);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.big .tc-in{border-radius:14px}
html.big .tc-tier{top:8px;left:12px;font-size:25px}
html.big .tc-in .ctag{top:10px;right:10px;height:20px;padding:0 7px;font-size:10.5px}
html.big .tc-in img{top:40px;width:160px;height:100px;margin-left:-80px}
html.big .tc-nm{left:10px;right:10px;bottom:14px;font-size:14.5px}
.prem .tc-in{border-color:rgba(255,214,140,.35)}
.gem{display:inline-block;width:8px;height:8px;margin-left:5px;vertical-align:3px;transform:rotate(45deg);background:linear-gradient(135deg,#fff3c4,#ffb627 50%,#ff5ab4);box-shadow:0 0 8px rgba(255,200,90,.8)}
.foil{position:absolute;top:-50%;bottom:-50%;left:-50%;right:-50%;z-index:2;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 36%,rgba(255,80,200,.22) 42%,rgba(90,220,255,.26) 48%,rgba(255,240,120,.24) 54%,rgba(140,255,170,.14) 58%,transparent 64%);
  animation:foil 3.4s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes foil{0%{transform:translateX(-38%)}100%{transform:translateX(38%)}}
.reel.spinning .foil{animation:none;opacity:.45}
.tcard.win .tc-in{border-color:var(--rc2);box-shadow:0 0 0 2px var(--rc),0 0 40px var(--rcg),0 20px 40px rgba(0,0,0,.6);animation:winzoom .9s cubic-bezier(.17,1.75,.4,1) both}
.tcard.win .tc-in::before{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;box-shadow:inset 0 0 30px var(--rcg);animation:winpulse 1.6s ease-in-out infinite}
.tcard.win.nofx .tc-in{animation:none;transform:scale(1.1)}
@keyframes winzoom{0%{transform:scale(1)}100%{transform:scale(1.1)}}
@keyframes winpulse{50%{opacity:.3}}
/* ---------- Плашка результата ---------- */
.plate{position:relative;height:var(--pl-h);display:grid;column-gap:16px;row-gap:6px;padding:12px 18px 12px 0;
  grid-template-columns:22px 150px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"s t i" "s t c"}
html.big .plate{column-gap:24px;row-gap:0;padding:0 26px 0 0;align-items:center;
  grid-template-columns:30px 206px minmax(220px,.95fr) minmax(0,1.55fr);grid-template-rows:1fr;grid-template-areas:"s t i c"}
.pl-clip{position:absolute;inset:0;overflow:hidden;border-radius:6px 16px 16px 6px;
  background:linear-gradient(90deg,rgba(24,24,34,.97),rgba(15,15,22,.96) 55%,rgba(20,14,20,.96));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.pl-clip::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--rc),transparent 60%)}
.pl-water{position:absolute;left:150px;top:50%;transform:translateY(-52%);font:900 italic 170px/1 var(--fd);letter-spacing:-.06em;color:var(--rcs);-webkit-text-stroke:2px var(--rcg);opacity:.5;white-space:nowrap}
html.big .pl-water{left:230px;font-size:250px;opacity:.55}
.pl-wipe{position:absolute;top:-10%;bottom:-10%;left:0;width:45%;opacity:0;background:linear-gradient(90deg,transparent,var(--a1) 30%,var(--a2) 70%,transparent);transform:translateX(-150%) skewX(-24deg)}
.pl-stripe{grid-area:s;position:relative;z-index:2;align-self:stretch;margin:-12px 0 -12px -6px}
html.big .pl-stripe{margin:0 0 0 -6px}
.pl-stripe::before,.pl-stripe::after{content:"";position:absolute;top:0;bottom:0;transform:skewX(-14deg);transform-origin:bottom}
.pl-stripe::before{left:0;width:14px;background:var(--grad);box-shadow:0 0 28px var(--a-glow);border-radius:6px 0 0 6px}
.pl-stripe::after{left:19px;width:4px;background:var(--rc);box-shadow:0 0 14px var(--rcg)}
html.big .pl-stripe::before{width:20px}html.big .pl-stripe::after{left:26px;width:5px}
.pl-tank{grid-area:t;position:relative;z-index:2;display:grid;place-items:center;height:100%}
.pl-tank::before{content:"";position:absolute;left:8%;right:8%;bottom:14px;height:26px;border-radius:50%;background:radial-gradient(closest-side,var(--rcg),transparent)}
.pl-tank img{position:relative;width:150px;height:94px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.75))}
html.big .pl-tank img{width:206px;height:129px}
.pl-id{grid-area:i;position:relative;z-index:2;min-width:0;display:flex;align-items:center;gap:8px}
html.big .pl-id{display:block}
.pl-meta{display:flex;align-items:center;gap:6px;flex:0 0 auto}
html.big .pl-meta{margin-bottom:10px;gap:8px}
.tierpill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:5px;transform:skewX(-12deg);background:var(--rc);color:#0b0b10;font:900 italic 12px/1 var(--fd);letter-spacing:.04em;box-shadow:0 0 18px var(--rcg);white-space:nowrap}
.tierpill span{transform:skewX(12deg)}
.tierpill .lv{font-style:inherit}
html:not(.big) .tierpill .lv{display:none}
.pl-meta .ctag{height:22px;padding:0 7px;font-size:10.5px}
html.big .tierpill,html.big .pl-meta .ctag{height:24px;font-size:12.5px}
.premtag{position:relative;overflow:hidden;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font:800 10px/1 var(--fu);letter-spacing:.1em;color:#2a1a00;background:linear-gradient(100deg,#ffe49e,#ffb627 45%,#ff8fd0 75%,#9fe7ff)}
.premtag .foil{opacity:.9}
.pl-name{min-width:0;font:900 italic 24px/1.1 var(--fd);letter-spacing:-.03em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.big .pl-name{font-size:44px;line-height:1.02;white-space:normal;overflow-wrap:anywhere;max-height:2.1em}
.pl-name.typing::after{content:"";display:inline-block;width:.12em;height:.8em;margin-left:.08em;background:var(--a2);vertical-align:-.02em;animation:live .5s steps(1) infinite}
@keyframes live{50%{opacity:.25}}
.pl-ch{grid-area:c;position:relative;z-index:2;min-width:0;display:flex;flex-direction:column;gap:6px}
html.big .pl-ch{padding-left:26px;gap:8px}
html.big .pl-ch::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,transparent,var(--line2),transparent);transform:skewX(-14deg)}
.pl-lbl{display:none;align-items:center;gap:8px;font:800 italic 11.5px/1 var(--fd);letter-spacing:.2em;color:var(--a2)}
.pl-lbl::before{content:"";width:22px;height:3px;background:var(--grad);transform:skewX(-30deg)}
html.big .pl-lbl{display:flex}
.flap{position:relative;min-height:46px;display:flex;align-items:center;padding:5px 14px;border-radius:10px;overflow:hidden;perspective:700px;
  background:linear-gradient(180deg,#1f1f2b 0,#1a1a24 50%,#14141c 50%,#111118 100%);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 2px 10px rgba(0,0,0,.4)}
html.big .flap{min-height:76px;padding:8px 22px;border-radius:12px}
.flap::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.65);box-shadow:0 1px 0 rgba(255,255,255,.05);z-index:3}
.flap .txt{position:relative;z-index:2;font:800 italic 15.5px/1.18 var(--fd);letter-spacing:-.015em;transform-origin:50% 0;backface-visibility:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html.big .flap .txt{font-size:24px}
.flap.rolling .txt{color:#b4b4c6}
.flap .sweep{position:absolute;top:-20%;bottom:-20%;left:0;width:40%;z-index:4;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-160%) skewX(-22deg)}
.flap.final{border-color:rgba(255,138,61,.55);box-shadow:0 0 0 1px rgba(255,61,90,.35),0 0 30px rgba(255,61,90,.25),inset 0 2px 10px rgba(0,0,0,.4)}
.flap.final.fx{animation:land .75s cubic-bezier(.2,1.7,.35,1) both}
.flap.final .txt{color:#fff;text-shadow:0 0 22px rgba(255,138,61,.55)}
.flap.final.fx .sweep{animation:sweep 1s .12s var(--out) both}
@keyframes land{0%{transform:scale(1.1)}35%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes sweep{0%{opacity:1;transform:translateX(-160%) skewX(-22deg)}100%{opacity:1;transform:translateX(330%) skewX(-22deg)}}

/* живой статус и итог проверки */
.live{display:flex;align-items:center;gap:10px;min-height:22px;min-width:0}
.live:empty{display:none}
.st{display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 10px;border-radius:5px;transform:skewX(-12deg);flex:0 0 auto;
  font:900 italic 11.5px/1 var(--fd);letter-spacing:.08em;white-space:nowrap}
.st>span{display:inline-flex;align-items:center;gap:6px;transform:skewX(12deg)}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pending{background:rgba(255,138,61,.14);color:#ffb38a;box-shadow:inset 0 0 0 1px rgba(255,138,61,.45)}
.st-pending i{box-shadow:0 0 10px currentColor;animation:live 1.4s ease-in-out infinite}
.st-ok{background:linear-gradient(100deg,var(--ok2),var(--ok));color:#03150c}
.st-fail{background:linear-gradient(100deg,var(--fail2),var(--fail));color:#fff}
.st-ambiguous{background:linear-gradient(100deg,var(--amb2),var(--amb));color:#241600}
.st-cancelled{background:var(--s3);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
.rt{min-width:0;font:700 13px/1.2 var(--fu);color:#d9d9e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt b{font-weight:800;color:#fff}
html.big .live{min-height:26px}
html.big .st{height:26px;font-size:13px;padding:0 12px}
html.big .rt{font-size:16px}
.live.pop .st{animation:stPop .6s cubic-bezier(.2,1.6,.4,1) both}
.live.pop .rt{animation:rtIn .6s .12s var(--out) both}
@keyframes stPop{0%{opacity:0;transform:skewX(-12deg) scale(1.6)}100%{opacity:1;transform:skewX(-12deg) scale(1)}}
@keyframes rtIn{from{opacity:0;transform:translateX(-14px)}}

.plate.in .pl-clip{animation:ltIn .7s var(--out) both}
.plate.in .pl-wipe{animation:ltWipe .85s .05s var(--out) both}
.plate.in .pl-stripe{animation:ltStripe .6s .1s var(--spring) both}
.plate.in .pl-tank{animation:ltTank .8s .18s cubic-bezier(.2,1.5,.4,1) both}
.plate.in .pl-id{animation:ltUp .6s .26s var(--out) both}
.plate.in .pl-ch{animation:ltUp .6s .34s var(--out) both}
.plate.in .pl-water{animation:ltWater 1.2s .2s var(--out) both}
@keyframes ltIn{from{opacity:0;transform:translateX(-46%) skewX(-10deg)}}
@keyframes ltWipe{0%{opacity:1;transform:translateX(-150%) skewX(-24deg)}100%{opacity:0;transform:translateX(260%) skewX(-24deg)}}
@keyframes ltStripe{from{transform:scaleY(0)}}
@keyframes ltTank{from{opacity:0;transform:translateX(-50px) scale(.7)}}
@keyframes ltUp{from{opacity:0;transform:translateY(14px)}}
@keyframes ltWater{from{opacity:0;transform:translateY(-52%) translateX(100px) scale(1.3)}}

/* штамп итога поверх плашки */
.pl-stamp{position:absolute;right:16px;top:-14px;z-index:9}
html.big .pl-stamp{right:30px;top:-30px}
.stamp{position:relative;display:inline-flex;align-items:center;padding:8px 18px;border-radius:6px;overflow:hidden;transform:skewX(-14deg);
  font:900 italic 20px/1 var(--fd);letter-spacing:.01em}
html.big .stamp{padding:12px 30px;font-size:32px}
.stamp>span{display:inline-flex;align-items:center;gap:9px;transform:skewX(14deg)}
.stamp svg{width:20px;height:20px}
html.big .stamp svg{width:30px;height:30px}
.stamp.fx{animation:stampIn .8s cubic-bezier(.16,1.25,.3,1) both}
.stamp.ok{background:linear-gradient(100deg,var(--ok2),var(--ok));color:#03150c;box-shadow:0 10px 30px rgba(46,229,157,.45)}
.stamp.fail{background:linear-gradient(100deg,var(--fail2),var(--fail));color:#fff;box-shadow:0 10px 30px rgba(255,61,90,.5)}
.stamp.ambiguous{background:linear-gradient(100deg,var(--amb2),var(--amb));color:#241600;box-shadow:0 10px 30px rgba(255,182,39,.4)}
.stamp.cancelled{background:var(--s3);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
.stamp .streak{position:absolute;top:-30%;bottom:-30%;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:translateX(-200%)}
.stamp.fx .streak{animation:stampStreak .9s .45s var(--out) both}
@keyframes stampIn{0%{opacity:0;transform:translateX(-700px) skewX(-14deg) scaleX(1.5)}60%{opacity:1}100%{transform:translateX(0) skewX(-14deg) scaleX(1)}}
@keyframes stampStreak{to{transform:translateX(480%)}}
/* ---------- Заголовок ленты и таблицы ---------- */
.whead{display:flex;align-items:center;gap:10px;height:30px;margin-bottom:8px;padding-left:2px}
.whead h1{margin:0;display:flex;align-items:center;gap:9px;font:900 italic 15px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.whead h1::before{content:"";width:18px;height:13px;background:var(--grad);transform:skewX(-22deg);border-radius:2px;box-shadow:0 0 14px var(--a-glow)}
.whead .sub{padding:4px 9px;border-radius:5px;transform:skewX(-12deg);background:rgba(18,18,25,.9);box-shadow:inset 0 0 0 1px var(--line2);color:#ffb38a;font:800 italic 10.5px/1 var(--fd);letter-spacing:.14em}
.whead .sub span{display:inline-block;transform:skewX(12deg)}
.whead .dot{width:7px;height:7px;border-radius:50%;background:var(--a1);box-shadow:0 0 10px var(--a1);animation:live 1.6s ease-in-out infinite}

/* ---------- Лента друзей ---------- */
#feed{width:480px;max-width:100vw;padding:4px 4px 0}
#feed .whead{opacity:0;transition:opacity .5s}
#feed.has .whead{opacity:1}
.fd-list{position:relative;display:flex;flex-direction:column;gap:8px}
.fcard{position:relative;height:132px;display:grid;grid-template-columns:128px minmax(0,1fr);column-gap:12px;padding:10px 14px 10px 12px}
.fc-clip{position:absolute;inset:0;border-radius:6px 14px 14px 6px;overflow:hidden;
  background:linear-gradient(90deg,rgba(24,24,34,.97),rgba(15,15,22,.96) 60%,rgba(20,14,20,.96));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.35)}
.fc-clip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--rc2),var(--rc));box-shadow:0 0 14px var(--rcg)}
.fc-clip::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--rc),transparent 55%)}
.fc-img{position:relative;z-index:2;height:112px;border-radius:10px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 110%,var(--rcs),transparent 70%),linear-gradient(180deg,#1b1b26,#111118);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.fc-img::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rc)}
.mr-strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.mr-item{position:relative;height:112px}
.mr-item img{position:absolute;left:50%;top:22px;width:112px;height:70px;margin-left:-56px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.mr-item b{position:absolute;top:6px;left:8px;font:900 italic 17px/1 var(--fd);letter-spacing:-.03em;color:var(--rc2);text-shadow:0 0 12px var(--rcg)}
.mr-item.rar-r1 b,.mr-item.rar-r2 b,.mr-item.rar-r3 b,.mr-item.rar-r4 b{color:var(--rc2)}
.fc-img .mflash{position:absolute;inset:0;z-index:3;opacity:0;background:radial-gradient(closest-side,rgba(255,255,255,.7),transparent)}
.fc-body{position:relative;z-index:2;min-width:0;display:flex;flex-direction:column;gap:4px}
.fc-nick{display:flex;align-items:center;gap:7px;min-width:0;font:900 italic 14px/20px var(--fd);letter-spacing:.02em;text-transform:uppercase}
.fc-nick span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:3px}
.fc-nick time{margin-left:auto;flex:0 0 auto;font:600 11px/1 var(--fu);color:var(--dim);text-transform:none}
.fc-tank{display:flex;align-items:center;gap:6px;min-width:0;height:20px}
.fc-tank .tierpill{height:18px;padding:0 7px;font-size:10.5px}
.fc-tank .ctag{height:18px;padding:0 5px;font-size:9.5px}
.fc-tank .nm{min-width:0;font:800 italic 13.5px/1.1 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-tank .premtag{height:18px;padding:0 6px;font-size:9px}
.fcard.has-stamp .fc-nick time{visibility:hidden}
.fc-ch{min-height:34px;font:700 13px/1.3 var(--fu);color:#e6e6f0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc-body .live{margin-top:auto}
.fcard .rt{font-size:12px}
.fcard.done .fc-clip{background:linear-gradient(90deg,rgba(20,20,28,.94),rgba(13,13,19,.93))}
.fcard.st-cancelled{opacity:.6}
.fc-stamp{position:absolute;right:10px;top:8px;z-index:5}
.fc-stamp .stamp{padding:5px 11px;font-size:13px}
.fc-stamp .stamp svg{width:14px;height:14px}
.fcard.enter{animation:fcIn .7s cubic-bezier(.2,1.3,.4,1) both}
.fcard.leave{animation:fcOut .45s var(--out) forwards}
@keyframes fcIn{from{opacity:0;transform:translateX(-60px) skewX(-8deg) scale(.96)}}
@keyframes fcOut{to{opacity:0;transform:translateX(70px) scale(.96)}}
.fcard.flash .fc-clip{animation:fcFlash .9s var(--out)}
@keyframes fcFlash{0%{box-shadow:inset 0 0 0 2px var(--rc2),0 0 40px var(--rcg)}100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.35)}}

/* ---------- Таблица ---------- */
#board{width:480px;max-width:100vw;padding:4px 4px 0}
.bd{position:relative;border-radius:6px 14px 14px 6px;overflow:hidden;
  background:linear-gradient(180deg,rgba(24,24,34,.96),rgba(14,14,20,.95));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.4)}
.bd::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--a1),var(--a2) 40%,transparent 80%)}
.bd-row{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) 44px 44px 54px 58px;align-items:center;column-gap:6px;height:50px;padding:0 12px 0 10px}
.bd-row+.bd-row,#bdRows>*{border-top:1px solid var(--line)}
.bd-hd{height:30px;font:800 italic 10.5px/1 var(--fd);letter-spacing:.14em;color:var(--muted)}
.bd-hd>*{text-align:center}.bd-hd>:nth-child(2){text-align:left}
.bd-rank{font:900 italic 20px/1 var(--fd);color:var(--dim);text-align:center;letter-spacing:-.03em}
.bd-row.r1 .bd-rank{color:#ffe49e;text-shadow:0 0 14px rgba(255,182,39,.6)}
.bd-row.r1::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;background:linear-gradient(180deg,#ffe49e,#ffb627);box-shadow:0 0 12px rgba(255,182,39,.6);border-radius:0 3px 3px 0}
.bd-who{min-width:0}
.bd-nick{display:flex;align-items:center;gap:6px;min-width:0;font:900 italic 15px/1.1 var(--fd);letter-spacing:.01em}
.bd-nick span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-nick em{flex:0 0 auto;padding:2px 5px;border-radius:4px;background:var(--a-soft);color:#ffb38a;font:800 normal 8.5px/1 var(--fu);letter-spacing:.1em}
.bd-bar{height:4px;margin-top:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.bd-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok2),var(--ok));transition:width .9s var(--out)}
.bd-n{text-align:center;font:900 italic 19px/1 var(--fd);letter-spacing:-.02em}
.bd-n.ok{color:var(--ok)}.bd-n.fail{color:#ff6f86}.bd-n.pct{font-size:16px;color:#fff}
.bd-n.zero{color:var(--dim)}
.bd-n.bump{animation:bump .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1.55)}100%{transform:scale(1)}}
.sk{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:44px;height:22px;padding:0 6px;border-radius:5px;transform:skewX(-12deg);font:900 italic 12px/1 var(--fd)}
.sk>span{transform:skewX(12deg)}
.sk.ok{background:rgba(46,229,157,.14);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(46,229,157,.4)}
.sk.fail{background:rgba(255,61,90,.14);color:#ff6f86;box-shadow:inset 0 0 0 1px rgba(255,61,90,.4)}
.sk.none{color:var(--dim)}
.bd-empty{padding:26px 16px;text-align:center;color:var(--muted);font:800 italic 14px/1.4 var(--fd)}

/* ---------- Команда: три колонки ---------- */
.w-team #main,.w-team #feed,.w-team #board,.w-team #series,.w-series #main,.w-series #feed,.w-series #board,.w-series #team{display:none!important}
html:not(.w-team) #team,html:not(.w-series) #series{display:none!important}
#team{position:relative;width:960px;height:320px;max-width:100vw;display:flex;align-items:center;justify-content:center}
/* «Эфирная плашка»: одна сплошная полоса из трёх скошенных сегментов, танк выступает над ней */
#tmCols{display:flex;align-items:stretch;justify-content:center;gap:0;height:184px;margin-top:22px}
.tm-col{position:relative;flex:0 0 296px;width:296px;height:184px}
.tm-col.is-owner{flex-basis:318px;width:318px}
.tm-col>*{position:absolute;z-index:1}
.tm-col>.tm-bg,.tm-col>.tm-water{z-index:0}
.tm-bg{top:0;left:0;right:0;bottom:0;transform:skewX(-8deg);
  background:radial-gradient(55% 75% at 22% 18%,var(--rcs),transparent 72%),linear-gradient(180deg,rgba(30,29,40,.97),rgba(12,12,18,.97));
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.05),0 22px 26px -14px rgba(0,0,0,.8);transition:box-shadow .5s}
.tm-bg::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.28) 50%,rgba(255,255,255,.06))}
.tm-col.is-owner .tm-bg{background:radial-gradient(70% 95% at 50% 0%,rgba(255,61,90,.2),transparent 70%),radial-gradient(55% 75% at 22% 18%,var(--rcs),transparent 72%),linear-gradient(180deg,rgba(38,30,40,.97),rgba(14,12,18,.97))}
.tm-col.is-owner .tm-bg::before{top:-2px;height:5px;background:var(--grad);box-shadow:0 0 16px rgba(255,90,70,.7),0 0 4px rgba(255,138,61,.9)}
/* угловой акцентный разделитель между сегментами */
.tm-col+.tm-col .tm-bg::after{content:"";position:absolute;left:-2px;top:-7px;bottom:-7px;width:4px;z-index:3;
  background:linear-gradient(180deg,var(--a2),var(--a1));box-shadow:0 0 12px rgba(255,61,90,.6)}
/* нижняя кромка: светится цветом статуса */
.tm-edge{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);transition:background .4s,box-shadow .4s}
.tm-edge::before{content:"";position:absolute;left:0;right:0;bottom:3px;height:60px;opacity:0;transition:opacity .5s;pointer-events:none}
.tm-col:not(.empty) .tm-edge{background:linear-gradient(90deg,var(--a1),var(--a2));animation:tmPend 1.8s ease-in-out infinite}
@keyframes tmPend{50%{opacity:.4}}
.tm-col.is-ok .tm-edge{background:var(--ok);box-shadow:0 0 10px 1px var(--ok),0 0 28px rgba(46,229,157,.6);animation:none}
.tm-col.is-ok .tm-edge::before{opacity:1;background:linear-gradient(0deg,rgba(46,229,157,.24),transparent)}
.tm-col.is-fail .tm-edge{background:var(--fail);box-shadow:0 0 10px 1px var(--fail),0 0 28px rgba(255,61,90,.6);animation:none}
.tm-col.is-fail .tm-edge::before{opacity:1;background:linear-gradient(0deg,rgba(255,61,90,.24),transparent)}
.tm-col.is-ambiguous .tm-edge{background:var(--amb);box-shadow:0 0 10px 1px var(--amb),0 0 26px rgba(255,182,39,.55);animation:none}
.tm-col.is-ambiguous .tm-edge::before{opacity:1;background:linear-gradient(0deg,rgba(255,182,39,.2),transparent)}
.tm-col.flash .tm-bg{animation:tmFlash .9s var(--out)}
@keyframes tmFlash{0%{box-shadow:inset 0 0 0 2px var(--rc2),inset 0 0 50px var(--rcg),0 0 40px var(--rcg)}}
/* шапка справа от танка: бейдж стримера + ник */
.tm-nick{left:174px;right:14px;top:6px;height:54px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:5px;min-width:0}
.tm-nick span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px;
  font:900 italic 16px/1.2 var(--fd);letter-spacing:.01em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.tm-col.is-owner .tm-nick span{font-size:17px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.tm-nick em{display:none;flex:0 0 auto;align-items:center;height:17px;padding:0 8px;border-radius:3px;transform:skewX(-12deg);background:var(--grad);color:#fff;
  font:900 italic 9.5px/1 var(--fd);letter-spacing:.16em;box-shadow:0 0 12px var(--a-glow)}
.tm-nick em b{display:inline-block;font:inherit;transform:skewX(12deg)}
.tm-col.is-owner .tm-nick em{display:inline-flex}
/* римский уровень — контурный водяной знак в правом верхнем углу */
.tm-water{right:12px;top:0;font:900 italic 60px/1 var(--fd);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px var(--rc);
  opacity:.28;white-space:nowrap;transition:opacity .4s}
/* сцена с танком: слева, выступает над плашкой */
.tm-stage{left:8px;top:-40px;width:160px;height:104px;overflow:hidden}
.tm-col.spinning .tm-stage{-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.tm-glow{position:absolute;left:50%;bottom:0;width:150px;height:26px;margin-left:-75px;border-radius:50%;background:radial-gradient(closest-side,var(--rcg),transparent);transition:opacity .4s}
.tm-reel{position:absolute;top:0;left:0;right:0;bottom:0}
.tm-reel.mb1{filter:url(#mb1)}.tm-reel.mb2{filter:url(#mb2)}
.tm-strip{position:absolute;left:50%;top:0;height:100%;display:flex;align-items:center;gap:16px;will-change:transform}
.tm-it{position:relative;flex:0 0 152px;width:152px;height:95px;transition:opacity .45s}
.tm-it img{display:block;width:152px;height:95px;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.75))}
.tm-strip.landed .tm-it:not(.win){opacity:0}
.tm-flash{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;pointer-events:none;background:radial-gradient(45% 60% at 50% 55%,rgba(255,255,255,.75),rgba(255,180,150,.15) 60%,transparent)}
.tm-col.spinning .tm-water{opacity:0}
.tm-col.spinning .tm-glow{opacity:.35}
/* пустой сегмент: карточка-загадка на месте танка, подпись в теле плашки */
.tm-empty{top:0;left:0;right:0;bottom:0;display:none}
.tm-empty svg{position:absolute;left:40px;top:-30px;width:90px;height:69px;overflow:visible;filter:drop-shadow(0 6px 14px rgba(255,61,90,.4));animation:tmBreath 3s ease-in-out infinite,mqFloat 3s ease-in-out infinite}
@keyframes mqFloat{50%{transform:translateY(-5px) rotate(-2deg)}}
.tm-empty span{position:absolute;left:20px;right:20px;top:96px;text-align:center;font:900 italic 15px/1.2 var(--fd);letter-spacing:.22em;text-transform:uppercase;color:#a6a6ba;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.tm-empty span::before,.tm-empty span::after{content:"";display:inline-block;vertical-align:middle;width:18px;height:2px;margin:0 10px 3px;background:rgba(255,255,255,.18)}
@keyframes tmBreath{50%{opacity:.55}}
.tm-col.empty .tm-empty{display:block}
.tm-col.empty .tm-water,.tm-col.empty .tm-reel,.tm-col.empty .tm-glow{display:none}
.tm-col.empty .tm-meta,.tm-col.empty .tm-ch,.tm-col.empty .tm-live{visibility:hidden}
/* строка «уровень · класс · название» на всю ширину сегмента */
.tm-meta{left:22px;right:16px;top:66px;height:22px;display:flex;align-items:center;justify-content:flex-start;gap:6px;min-width:0}
.tm-meta .tierpill{height:19px;padding:0 8px;font-size:11px;flex:0 0 auto}
.tm-meta .tierpill .lv{display:none}
.tm-meta .ctag{height:19px;padding:0 6px;font-size:10px;flex:0 0 auto}
.tm-meta .premtag{height:19px;padding:0 6px;font-size:9px;flex:0 0 auto}
.tm-meta .nm{min-width:0;margin-left:2px;font:900 italic 15px/1.2 var(--fd);letter-spacing:-.01em;color:var(--rc2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:3px;text-shadow:0 2px 6px rgba(0,0,0,.7)}
/* челлендж: до двух строк, слева акцентная скошенная черта */
.tm-ch{left:18px;right:18px;top:94px;height:42px;display:flex;align-items:center;padding:0 2px 0 13px;overflow:hidden;perspective:600px}
.tm-ch::before{content:"";position:absolute;left:1px;top:3px;bottom:3px;width:3px;transform:skewX(-8deg);background:rgba(255,255,255,.2);transition:background .3s,box-shadow .3s}
.tm-ch .txt{min-width:0;font:800 italic 14px/1.28 var(--fd);letter-spacing:-.005em;transform-origin:50% 0;backface-visibility:hidden;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tm-ch.long .txt{font-size:12.5px;line-height:1.3}
.tm-ch.rolling .txt{color:#a9a9bd}
.tm-ch.final::before{background:var(--grad);box-shadow:0 0 10px rgba(255,90,70,.6)}
.tm-ch.fx{animation:land .75s cubic-bezier(.2,1.7,.35,1) both}
/* статус: маленький ярлык + текст итога */
.tm-live{left:13px;right:22px;top:144px;height:24px;display:flex;align-items:center;justify-content:flex-start;gap:8px;min-width:0}
.tl{display:inline-flex;align-items:center;flex:0 0 auto;height:20px;padding:0 9px;border-radius:3px;transform:skewX(-12deg);
  font:900 italic 10.5px/1 var(--fd);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.tl>span{display:inline-block;transform:skewX(12deg)}
.tl-pending{background:rgba(255,138,61,.14);color:#ffb38a;box-shadow:inset 0 0 0 1px rgba(255,138,61,.45)}
.tl-pending>span{animation:tlPulse 1.6s ease-in-out infinite}
@keyframes tlPulse{50%{opacity:.55}}
.tl-ok{background:linear-gradient(100deg,var(--ok2),var(--ok));color:#03150c;box-shadow:0 4px 16px rgba(46,229,157,.3)}
.tl-fail{background:linear-gradient(100deg,var(--fail2),var(--fail));color:#fff;box-shadow:0 4px 16px rgba(255,61,90,.3)}
.tl-ambiguous{background:linear-gradient(100deg,var(--amb2),var(--amb));color:#241600}
.tl-cancelled{background:var(--s3);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
.tl-rt{min-width:0;font:700 12.5px/1.2 var(--fu);color:#e2e2ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.tm-live.pop .tl{animation:stPop .6s cubic-bezier(.2,1.6,.4,1) both}
.tm-live.pop .tl-rt{animation:rtIn .6s .12s var(--out) both}
/* штамп итога «приклеивается» на верхнюю кромку сегмента справа */

<script>
'use strict';
// Виджеты читают комнату без входа: правила разрешают чтение rooms/{id} всем.
// js/room.js тут не подключаем: его init() всегда делает signInAnonymously (нужен auth SDK, и каждый
// перезапуск источника OBS плодил бы анонимных пользователей), а виджетам запись не нужна.
// Поэтому читаем базу напрямую через firebase.database() с тем же конфигом.
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const W = (function () { const w = (params.get('w') || params.get('obs') || 'main').toLowerCase(); return ['feed', 'board', 'team', 'series'].indexOf(w) >= 0 ? w : 'main'; })();
const ROOM = (function () { const r = (params.get('room') || '').trim().toLowerCase(); return /^[a-z0-9]{10}$/.test(r) ? r : null; })();
const BIG = params.get('size') === 'big';
// По умолчанию считаем всё с последнего «Обнулить» в панели (стрим часто идёт за полночь);
// &period=today — только сегодняшние бои, с нуля в полночь
const PERIOD_ALL = params.get('period') !== 'today';
const HAS_SERVER = location.protocol.indexOf('http') === 0;

const FB_CONFIG = {
  apiKey: 'AIzaSyA2QzcnPMFE5GBiIItm1M1L0trRimFsfu8',
  authDomain: 'wotbase-311fc.firebaseapp.com',
  databaseURL: 'https://wotbase-311fc-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'wotbase-311fc',
  storageBucket: 'wotbase-311fc.firebasestorage.app',
  messagingSenderId: '259612791074',
  appId: '1:259612791074:web:2fbcb943094e8c30be957b',
};
const SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';

const TYPES = { lightTank: 'ЛТ', mediumTank: 'СТ', heavyTank: 'ТТ', 'AT-SPG': 'ПТ', SPG: 'САУ' };
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
const STATUSES = ['pending', 'ok', 'fail', 'ambiguous', 'cancelled'];

// ---------- Утилиты ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (x, d) => (typeof x === 'number' && isFinite(x) ? x : d);
const str = x => (x == null ? '' : typeof x === 'string' ? x : typeof x === 'number' ? String(x) : '');
const RAR = tier => tier >= 10 ? 'r4' : tier >= 8 ? 'r3' : tier >= 5 ? 'r2' : 'r1';
const RAR_COLORS = {
  r1: ['#5f93d6', '#b6d3f8', '#ffffff', '#3d6fb8'],
  r2: ['#9b5cff', '#d4b9ff', '#ffffff', '#ff8a3d'],
  r3: ['#ff2d6f', '#ffa3c1', '#ffffff', '#ff8a3d'],
  r4: ['#ffb627', '#ffe49e', '#ffffff', '#ff5ab4'],
};
function setRar(el, tier) {
  el.classList.remove('rar-r1', 'rar-r2', 'rar-r3', 'rar-r4');
  el.classList.add('rar-' + RAR(tier));
}
function anim(el, kf, opt) { try { return el && el.animate ? el.animate(kf, opt) : null; } catch (e) { return null; } }
const IMG_ERR = 'onerror="this.style.visibility=\'hidden\'"';

// Танк из базы/payload -> безопасный объект
function normTank(t) {
  t = t && typeof t === 'object' ? t : {};
  const tier = Math.max(1, Math.min(11, Math.round(num(+t.tier, 1)) || 1));
  return { id: t.id, name: str(t.name) || 'Танк', tier, type: TYPES[t.type] ? t.type : '', prem: !!t.prem, img: str(t.img) };
}
// Спин (запись комнаты или payload /api/state) -> объект, с которым можно работать без проверок
function norm(raw) {
  raw = raw && typeof raw === 'object' ? raw : {};
  let items = Array.isArray(raw.items) ? raw.items.filter(x => x && typeof x === 'object').map(normTank) : [];
  let wi = Math.round(num(+raw.winIndex, 0));
  if (!items.length) { items = [normTank(raw.tank)]; wi = 0; }
  wi = Math.max(0, Math.min(items.length - 1, wi));
  const tank = raw.tank && typeof raw.tank === 'object' ? normTank(raw.tank) : items[wi];
  const chObj = raw.challenge && typeof raw.challenge === 'object' ? raw.challenge : null;
  let ch = Array.isArray(raw.ch) ? raw.ch.map(str).filter(Boolean) : [];
  const chText = str(chObj && chObj.text);
  if (chText && ch[ch.length - 1] !== chText) ch.push(chText); // итог — всегда текст челленджа
  if (!ch.length) ch = [''];
  const res = raw.result && typeof raw.result === 'object' ? raw.result : null;
  let resultText = str(res && res.text) || str(raw.resultText);
  const status = STATUSES.indexOf(raw.status) >= 0 ? raw.status : null;
  if (!resultText && res && res.by === 'manual' && (status === 'ok' || status === 'fail')) resultText = 'решение стримера';
  return {
    id: str(raw.id), acc: str(raw.acc), nick: str(raw.nick) || 'Игрок', owner: raw.owner === true,
    ts: num(+raw.ts, 0), kind: raw.kind === 'challenge' ? 'challenge' : 'full',
    items, winIndex: wi, jitter: Math.max(-0.5, Math.min(0.5, num(+raw.jitter, 0))),
    dur: Math.max(1500, Math.min(20000, num(+raw.dur, 7000))),
    ch, chFinal: ch[ch.length - 1], tank, status, resultText, auto: !!(chObj && chObj.auto),
    rerolls: num(+raw.rerolls, 0), checkedAt: num(+(res && res.checkedAt), 0), battleAt: num(+(res && res.battleAt), 0),
  };
}
// когда бой засчитан: для порядка итогов в «Серии» и таблице (ручное решение позже не двигает старый бой в конец)
const resultTime = sp => sp.battleAt || sp.checkedAt || sp.ts;
const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const ICON_FAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_AMB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>';
const ST_LABEL = { pending: 'ЖДЁМ БОЙ', ok: 'ВЫПОЛНЕНО', fail: 'ПРОВАЛ', ambiguous: 'НА ПРОВЕРКЕ', cancelled: 'ОТМЕНЁН' };
// строка статуса: плашка + итог проверки
function liveHTML(sp) {
  if (!sp.status) return '';
  const lbl = sp.status === 'pending' && !sp.auto && sp.owner ? 'ЖДЁМ ИТОГ' : ST_LABEL[sp.status];
  return `<span class="st st-${sp.status}"><span>${sp.status === 'pending' ? '<i></i>' : ''}${lbl}</span></span>`
    + (sp.resultText ? `<span class="rt">${esc(sp.resultText)}</span>` : '');
}
function stampHTML(st, fx) {
  if (st !== 'ok' && st !== 'fail' && st !== 'ambiguous' && st !== 'cancelled') return '';
  const icon = st === 'ok' ? ICON_OK : st === 'fail' ? ICON_FAIL : st === 'ambiguous' ? ICON_AMB : '';
  const txt = st === 'ok' ? 'ВЫПОЛНЕНО' : st === 'fail' ? 'ПРОВАЛ' : st === 'ambiguous' ? 'ПРОВЕРКА' : 'ОТМЕНЁН';
  return `<div class="stamp ${st}${fx ? ' fx' : ''}"><span>${icon}${txt}</span><i class="streak"></i></div>`;
}
function metaHTML(t) {
  return `<span class="tierpill"><span>${ROMAN[t.tier]}<em class="lv"> уровень</em></span></span>`
    + (t.type ? `<span class="ctag ct-${t.type}">${TYPES[t.type]}</span>` : '')
    + (t.prem ? '<span class="premtag">ПРЕМ<i class="foil"></i></span>' : '');
}
// ---------- Звук (только WebAudio) ----------
const SOUND = !params.has('mute') && (W === 'main' || W === 'team' || params.get('sound') === '1');
let ac = null, noiseBuf = null;
function audio() {
  if (!SOUND) return null;
  try { ac = ac || new AudioContext(); if (ac.state === 'suspended') ac.resume(); return ac; } catch (e) { return null; }
}
function beep(freq, dur, vol, type, delay) {
  const a = audio(); if (!a) return;
  try {
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function sweep(f0, f1, dur, vol, type, delay) {
  const a = audio(); if (!a) return;
  try {
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noise(dur, f0, f1, vol, delay, q) {
  const a = audio(); if (!a) return;
  try {
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = a.currentTime + (delay || 0);
    const src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; src.loop = true;
    bp.type = 'bandpass'; bp.Q.value = q || 1.2;
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.08, dur * 0.3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp).connect(g).connect(a.destination); src.start(t); src.stop(t + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  whoosh() { noise(0.9, 300, 4200, 0.13); sweep(70, 240, 0.7, 0.07, 'sawtooth'); },
  tick() { beep(2300, 0.014, 0.035, 'square'); beep(160, 0.035, 0.06, 'sine'); },
  impact() {
    sweep(170, 38, 0.6, 0.3, 'sine'); noise(0.45, 2600, 250, 0.16);
    [392, 494, 587, 784].forEach((f, i) => beep(f, 0.55, 0.035, 'sawtooth', 0.02 + i * 0.015));
  },
  flap(i) { beep(1500 - i * 25, 0.016, 0.04, 'square'); beep(320, 0.02, 0.03, 'triangle'); },
  land() {
    sweep(240, 50, 0.45, 0.22, 'sine');
    [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, 0.32, 0.055, 'triangle', i * 0.075));
    noise(0.7, 5000, 9500, 0.045, 0.12, 0.8);
  },
  ok() { [659, 880, 1175, 1568].forEach((f, i) => beep(f, 0.3, 0.06, 'triangle', i * 0.08)); noise(0.5, 3000, 9000, 0.05, 0.05); },
  fail() { sweep(320, 80, 0.7, 0.1, 'sawtooth'); beep(98, 0.5, 0.09, 'square', 0.06); noise(0.4, 900, 200, 0.08); },
  amb() { [523, 440].forEach((f, i) => beep(f, 0.22, 0.05, 'triangle', i * 0.12)); },
};
const statusSound = st => { const f = st === 'ok' ? sfx.ok : st === 'fail' ? sfx.fail : st === 'ambiguous' ? sfx.amb : null; if (f) f(); };

// ---------- Firebase: только чтение, без входа ----------
const FB = { db: null, offset: 0 };
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = false;
    s.onload = () => res();
    s.onerror = () => { s.remove(); rej(new Error('не загрузился ' + src)); };
    document.head.appendChild(s);
  });
}
// грузим SDK сами: если интернета нет при старте источника — пробуем снова, пока не получится
let fbP = null;
function fbConnect() {
  if (fbP) return fbP;
  fbP = (async () => {
    for (let n = 0; ; n++) {
      try {
        if (!window.firebase || !window.firebase.initializeApp) await loadScript(SDK + 'firebase-app-compat.js');
        if (!window.firebase.database) await loadScript(SDK + 'firebase-database-compat.js');
        const fb = window.firebase;
        const app = fb.apps.length ? fb.app() : fb.initializeApp(FB_CONFIG);
        FB.db = app.database();
        FB.db.ref('.info/serverTimeOffset').on('value', s => { FB.offset = num(s.val(), 0); });
        return FB.db;
      } catch (e) {
        console.warn('[obs] Firebase недоступен, повтор позже:', e && e.message);
        await sleep(Math.min(60000, 10000 + n * 5000));
      }
    }
  })();
  return fbP;
}
const serverNow = () => Date.now() + FB.offset;
// начало сегодняшнего дня (по часам этого компьютера) в серверном времени
function dayStart() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() + FB.offset; }

// Последние limit спинов комнаты. on(event, spin, initial):
//   'reset' — (пере)подписка, 'added' | 'changed' | 'removed', 'ready' — начальная загрузка пришла.
// Обрыв связи SDK переживает сам; отказ (правила) — переподписка через 30 с.
// since(): с какого момента (серверное время) брать спины — вместо limit, чтобы не тянуть лишнее
// (в каждом спине лента из ~64 танков, это несколько КБ).
function watchSpins(limit, on, since) {
  const call = (ev, sp, initial) => { try { on(ev, sp, initial); } catch (e) { console.error(e); } };
  const start = () => {
    let initial = true, failed = false;
    let q = FB.db.ref('rooms/' + ROOM + '/spins').orderByChild('ts');
    q = since ? q.startAt(since()) : q.limitToLast(limit);
    const fail = e => {
      if (failed) return;
      failed = true;
      console.warn('[obs] нет доступа к спинам комнаты:', e && e.message);
      try { q.off(); } catch (x) {}
      setTimeout(start, 30000);
    };
    const h = ev => s => { const v = s.val(); call(ev, Object.assign({}, v && typeof v === 'object' ? v : {}, { id: s.key }), initial); };
    call('reset', null, true);
    q.on('child_added', h('added'), fail);
    q.on('child_changed', h('changed'), fail);
    q.on('child_removed', h('removed'), fail);
    q.once('value', () => { initial = false; call('ready', null, false); }, () => {});
  };
  fbConnect().then(start);

        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.45,
        w: spark ? 2 : (6 + Math.random() * 8) * k, h: spark ? 2 : (3 + Math.random() * 4) * k,
        c: spark ? '#ffffff' : cols[i % cols.length], life: 0, max: 70 + Math.random() * 70, spark, fl: Math.random() * 6.28,

  const n = R.cards.length;

  const c = R.reelW / 2;

// последний активный челлендж каждого друга + решённые за 15 минут, новые сверху
function computeFeed() {
  const now = serverNow(), active = {}, done = [];
  F.spins.forEach(raw => {
    if (raw.owner === true) return;
    const sp = norm(raw);
    if (!sp.status || sp.status === 'pending' || sp.status === 'ambiguous') {
      if (now - sp.ts > STALE) return;
      const cur = active[sp.acc];
      if (!cur || sp.ts > cur.ts) active[sp.acc] = sp;
    } else if (sp.status === 'ok' || sp.status === 'fail') {
      if (now - (sp.checkedAt || sp.ts) < RECENT) done.push(sp);

  const act = Object.keys(active).map(k => active[k]).sort(byTs).slice(0, FEED_MAX);

  return act.concat(done.slice(0, FEED_MAX - act.length)).sort(byTs);

// FLIP: запомнить положения -> поменять DOM -> анимировать сдвиг
function measure(map) {

  map.forEach((c, id) => { pos[id] = c.el.getBoundingClientRect().top; });
  return pos;
}
function flip(map, first) {

    if (!(id in first)) return;
    const d = first[id] - c.el.getBoundingClientRect().top;
    if (Math.abs(d) > 0.5) anim(c.el, [{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 500, easing: 'cubic-bezier(.2,.9,.25,1)' });

}
// расставить карточки в DOM по порядку keys; true — что-то сдвинулось

  keys.forEach(k => {
    const c = map.get(k);
    if (!c) return;
    if (list.children[idx] !== c.el) { list.insertBefore(c.el, list.children[idx] || null); moved = true; }
    idx++;

}

const runFeed = makeRunner(async () => {
  if (!F.ready) return;
  const list = $('#fdList');
  $('#feed').hidden = false;
  const want = computeFeed(), ids = want.map(s => s.id);
  // 1) уходящие
  const leaving = [];
  F.cards.forEach((c, id) => { if (ids.indexOf(id) < 0) leaving.push(id); });
  if (leaving.length) {
    leaving.forEach(id => F.cards.get(id).el.classList.add('leave'));
    await sleep(450);
    const first = measure(F.cards);
    leaving.forEach(id => { const c = F.cards.get(id); if (c) c.el.remove(); F.cards.delete(id); });
    flip(F.cards, first);
  }
  // 2) обновления на месте
  for (const sp of want) {
    const c = F.cards.get(sp.id);
    if (!c) continue;
    if (sp.chFinal !== c.ch) { await flipChallenge(c, sp); continue; }
    if (sp.status !== c.st || sp.resultText !== c.rt) {
      const big = sp.status !== c.st;
      updateCard(c, sp, true);
      if (big) await sleep(900);
    }
  }
  // 3) новые: от старых к свежим, свежий окажется сверху
  const fresh = want.filter(sp => !F.cards.has(sp.id)).reverse();
  for (const sp of fresh) {
    const live = F.live.has(sp.id) && serverNow() - sp.ts < 5 * 60 * 1000;
    F.live.delete(sp.id);
    const first = measure(F.cards);
    const c = createCard(sp, live);
    F.cards.set(sp.id, c);
    placeCards(list, F.cards, ids);
    flip(F.cards, first);
    $('#feed').classList.add('has');
    if (live) await revealCard(c, sp);
    else updateCard(c, sp, false);
  }
  // 4) порядок
  const first = measure(F.cards);
  if (placeCards(list, F.cards, ids)) flip(F.cards, first);
  $('#feed').classList.toggle('has', F.cards.size > 0);
});

const B = { spins: new Map(), players: {}, whitelist: {}, rows: new Map(), ready: false, shown: false };

function computeBoard() {
  const from = PERIOD_ALL ? 0 : dayStart(), stats = {};
  const get = (acc, nick, owner) => {
    const s = stats[acc] || (stats[acc] = { acc, nick, owner, ok: 0, fail: 0, res: [] });
    if (owner) s.owner = true; // owner: true пишет только владелец (правила)
    return s;
  };
  Object.keys(B.players || {}).forEach(acc => {
    const p = B.players[acc] && typeof B.players[acc] === 'object' ? B.players[acc] : {};
    get(acc, str(p.nick) || 'Игрок', p.owner === true);
  });
  // друзья из списка видны сразу, даже если ещё не заходили в комнату
  Object.keys(B.whitelist || {}).forEach(acc => {
    const p = B.whitelist[acc] && typeof B.whitelist[acc] === 'object' ? B.whitelist[acc] : {};
    get(acc, str(p.nick) || 'Игрок', false);
  });
  B.spins.forEach(raw => {
    const sp = norm(raw);
    if (!sp.acc || sp.ts < from) return;
    const s = get(sp.acc, sp.nick, sp.owner);
    if (sp.status === 'ok') s.ok++; else if (sp.status === 'fail') s.fail++; else return;
    s.res.push({ t: resultTime(sp), st: sp.status });
  });
  return Object.keys(stats).map(k => {
    const s = stats[k];
    s.res.sort((a, b) => a.t - b.t);
    let streak = 0, kind = null;
    for (let i = s.res.length - 1; i >= 0; i--) {
      if (kind === null) kind = s.res[i].st;
      if (s.res[i].st !== kind) break;
      streak++;
    }
    s.streak = streak; s.skind = kind;
    s.pct = s.ok + s.fail ? Math.round(s.ok * 100 / (s.ok + s.fail)) : -1;
    return s;
  }).sort((a, b) => b.ok - a.ok || b.pct - a.pct || a.fail - b.fail || (b.owner ? 1 : 0) - (a.owner ? 1 : 0) || a.nick.localeCompare(b.nick));
}

function setNum(el, to, fmt) {

const runBoard = makeRunner(async () => {

  const first = measure(B.rows);

  rows.forEach((s, i) => {

// Спины одного игрока (индекс acc): занятые друзья не вытесняют спины стримера из общего окна.
// on(event, spin, initial) — те же события, что у watchSpins. Возвращает stop().
function watchAcc(acc, limit, on) {

  const call = (ev, sp, initial) => { if (stopped) return; try { on(ev, sp, initial); } catch (e) { console.error(e); } };
  const start = () => {
    if (stopped) return;
    let initial = true, failed = false;
    const my = FB.db.ref('rooms/' + ROOM + '/spins').orderByChild('acc').equalTo(acc).limitToLast(limit);
    q = my;
    const fail = e => {
      if (failed) return;

      console.warn('[obs] нет доступа к спинам игрока:', e && e.message);
      try { my.off(); } catch (x) {}
      if (!stopped) timer = setTimeout(start, 30000);

    const h = ev => s => { const v = s.val(); call(ev, Object.assign({}, v && typeof v === 'object' ? v : {}, { id: s.key }), initial); };
    call('reset', null, true);
    my.on('child_added', h('added'), fail);

function rosterCompute() {

  let owner = '';

  if (!owner) owner = RS.guess;
  const nickOf = acc => str(obj(pl, acc).nick) || str(obj(wl, acc).nick);

  // старые комнаты без белого списка — берём вошедших игроков

    .map(acc => ({ acc, nick: nickOf(acc) || 'Игрок', owner: false, t: num(+obj(pl, acc).joinedAt, LATE) }));
  friends.sort((a, b) => (a.t < b.t ? -1 : a.t > b.t ? 1 : a.nick.localeCompare(b.nick)));

    .catch(() => null);
  const reload = () => {
    // защита от зацикливания: не чаще раза в 10 минут
    try {
      const last = +sessionStorage.getItem('wrUpd') || 0;
      if (Date.now() - last < 600000) return;
      sessionStorage.setItem('wrUpd', String(Date.now()));
    } catch (e) {}
    const u = new URL(location.href);
    u.searchParams.set('_v', String(Date.now())); // мимо кэша CDN
    location.replace(u.toString());
  };
  let base = '';
  const check = () => probe().then(v => {
    if (!v) return;
    if (isFinite(docLM) && isFinite(v.lm)) { if (v.lm > docLM + 1000) reload(); return; }
    // нет дат — по ETag: первая удачная проверка становится точкой отсчёта
    if (!v.tag) return;
    if (!base) { base = v.tag; return; }
    if (v.tag !== base) reload();
  });
  check();
  setInterval(check, 120000);
})();
</script>
</body>
</html>
